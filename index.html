<script type="text/babel">
/* Daily v2 — Doctor Report */
const { useState: useState_R, useRef: useRef_R } = React;

function ScreenReport({ go, entries, meds, symptoms, activities, profile }) {
  const [range, setRange] = useState_R(14);
  const [customStart, setCustomStart] = useState_R("");
  const [customEnd, setCustomEnd] = useState_R("");

  const now = Date.now();
  const cutoff = range === "custom"
    ? (customStart ? new Date(customStart).getTime() : now - 14*86400000)
    : now - range * 86400000;
  const endT = range === "custom"
    ? (customEnd ? new Date(customEnd + "T23:59:59").getTime() : now)
    : now;

  const inRange = t => t >= cutoff && t <= endT;
  const rangeEntries   = entries.filter(e => inRange(e.t));
  const rangeSymptoms  = symptoms.filter(s => inRange(s.t || Date.now()));
  const rangeActivities= activities.filter(a => inRange(a.t));
  const moodEntries    = rangeEntries.filter(e => e.kind === "mood");
  const noteEntries    = rangeEntries.filter(e => e.kind === "note");
  const sideEffects    = rangeSymptoms.filter(s => s.kind === "side-effect");
  const generalSymptoms= rangeSymptoms.filter(s => s.kind !== "side-effect");

  const avgMood = moodEntries.length
    ? (moodEntries.reduce((s,e) => s+(e.intensity||5),0)/moodEntries.length).toFixed(1) : "—";

  const avgSleep = rangeActivities.length
    ? (rangeActivities.reduce((s,a)=>s+(a.sleep||0),0)/rangeActivities.length).toFixed(1) : "—";

  const exerciseDays = rangeActivities.filter(a => a.exercise > 0).length;

  const medProfiles = [...new Map(meds.map(m => [`${m.name}|${m.dose}`, m])).values()];

  const dateLabel = range === "custom"
    ? `${customStart || "?"} – ${customEnd || "today"}`
    : `Last ${range} days`;

  const genDate = new Date().toLocaleDateString([], {year:"numeric",month:"long",day:"numeric"});

  const printReport = () => window.print();

  const emailReport = () => {
    const lines = [];
    lines.push(`DAILY HEALTH REPORT`);
    lines.push(`Patient: ${profile.name}${profile.email ? " <" + profile.email + ">" : ""}`);
    lines.push(`Period: ${dateLabel}`);
    lines.push(`Generated: ${genDate}\n`);
    lines.push(`MOOD SUMMARY`);
    lines.push(`Average mood: ${avgMood}/10  |  Entries: ${moodEntries.length}`);
    if (moodEntries.length) {
      const counts = {};
      moodEntries.forEach(e => { counts[e.label] = (counts[e.label]||0)+1; });
      lines.push(`Most frequent: ${Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([l,c])=>`${l} (${c}x)`).join(", ")}`);
    }
    lines.push(`\nMEDICATION ADHERENCE`);
    if (medProfiles.length) {
      medProfiles.forEach(m => {
        const taken = meds.filter(d => d.name===m.name && d.dose===m.dose && d.taken).length;
        const total = meds.filter(d => d.name===m.name && d.dose===m.dose).length;
        const pct = total ? Math.round(taken/total*100) : 0;
        lines.push(`${m.name} ${m.dose}: ${pct}% adherence (${taken}/${total} doses taken)`);
      });
    } else { lines.push("No medications on record."); }
    lines.push(`\nSIDE EFFECTS (${sideEffects.length} logged)`);
    if (sideEffects.length) {
      const seCounts = {};
      sideEffects.forEach(s => { seCounts[s.name] = (seCounts[s.name]||0)+1; });
      Object.entries(seCounts).sort((a,b)=>b[1]-a[1]).forEach(([n,c]) => lines.push(`• ${n}: ${c}x (avg sev ${(sideEffects.filter(s=>s.name===n).reduce((t,s)=>t+s.sev,0)/c).toFixed(1)}/10)`));
    }
    lines.push(`\nSYMPTOMS (${generalSymptoms.length} logged)`);
    if (generalSymptoms.length) {
      const symCounts = {};
      generalSymptoms.forEach(s => { symCounts[s.name] = (symCounts[s.name]||0)+1; });
      Object.entries(symCounts).sort((a,b)=>b[1]-a[1]).forEach(([n,c]) => lines.push(`• ${n}: ${c}x`));
    }
    lines.push(`\nACTIVITY`);
    lines.push(`Avg sleep: ${avgSleep} hrs  |  Exercise days: ${exerciseDays}/${rangeActivities.length}`);
    if (rangeActivities.length) {
      const avgStress = (rangeActivities.reduce((s,a)=>s+(a.stress||0),0)/rangeActivities.length).toFixed(1);
      lines.push(`Avg stress: ${avgStress}/5`);
    }
    if (noteEntries.length) {
      lines.push(`\nJOURNAL NOTES (${noteEntries.length})`);
      noteEntries.slice(0,3).forEach(e => lines.push(`• ${new Date(e.t).toLocaleDateString()}: "${(e.text||"").slice(0,120)}${(e.text||"").length>120?"…":""}"`));
    }
    lines.push(`\n---\nGenerated by Daily — for your mind`);
    const subject = encodeURIComponent(`Health Report — ${profile.name} — ${dateLabel}`);
    const body = encodeURIComponent(lines.join("\n"));
    const to = encodeURIComponent(profile.therapistEmail || "");
    window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
  };

  const SECounts = {};
  sideEffects.forEach(s => { SECounts[s.name] = { count:(SECounts[s.name]?.count||0)+1, totalSev:(SECounts[s.name]?.totalSev||0)+s.sev }; });
  const moodCounts = {};
  moodEntries.forEach(e => { moodCounts[e.label] = (moodCounts[e.label]||0)+1; });
  const symCounts = {};
  generalSymptoms.forEach(s => { symCounts[s.name] = (symCounts[s.name]||0)+1; });

  return (
    <div className="scroll report-screen" data-screen-label="Report">
      <PageHeader title="Doctor's Report" onBack={() => go("insights")}/>

      {/* Range selector */}
      <div className="report-range-row" data-no-print>
        {[7,14,30,90].map(d => (
          <button key={d} className={`rr-btn ${range===d?"on":""}`} onClick={() => setRange(d)}>
            {d === 7 ? "1 wk" : d === 14 ? "2 wks" : d === 30 ? "1 mo" : "3 mo"}
          </button>
        ))}
        <button className={`rr-btn ${range==="custom"?"on":""}`} onClick={() => setRange("custom")}>Custom</button>
      </div>
      {range === "custom" && (
        <div className="custom-range-row" data-no-print>
          <input type="date" value={customStart} onChange={e=>setCustomStart(e.target.value)} max={customEnd||undefined}/>
          <span className="muted small">to</span>
          <input type="date" value={customEnd} onChange={e=>setCustomEnd(e.target.value)} min={customStart||undefined}/>
        </div>
      )}

      {/* Patient card */}
      <div className="report-patient-card">
        <div className="rpc-name">{profile.name}</div>
        <div className="rpc-meta">{profile.email || ""}{profile.conditions?.length ? " · " + profile.conditions.join(", ") : ""}</div>
        <div className="rpc-range">{dateLabel} · Generated {genDate}</div>
      </div>

      {/* Summary stats */}
      <div className="report-stat-grid">
        <div className="report-stat">
          <div className="report-stat-val">{avgMood}</div>
          <div className="report-stat-label">Avg mood</div>
        </div>
        <div className="report-stat">
          <div className="report-stat-val">{avgSleep}</div>
          <div className="report-stat-label">Avg sleep</div>
        </div>
        <div className="report-stat">
          <div className="report-stat-val">{sideEffects.length}</div>
          <div className="report-stat-label">Side effects</div>
        </div>
      </div>

      {/* Mood section */}
      <SectionLabel>Mood — {moodEntries.length} entries</SectionLabel>
      <Card>
        {moodEntries.length === 0 ? (
          <div className="report-empty">No mood entries in this period.</div>
        ) : (
          <>
            <div className="mood-trend-bars" style={{marginBottom:8}}>
              {moodEntries.slice().reverse().slice(-20).map((e,i) => (
                <div key={i} className="mtb" style={{height:`${((e.intensity||5)/10)*100}%`, background: e.color||"var(--accent)"}}/>
              ))}
            </div>
            <table className="report-table">
              <thead><tr><th>Emotion</th><th>Count</th><th>Frequency</th></tr></thead>
              <tbody>
                {Object.entries(moodCounts).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([label, count]) => (
                  <tr key={label}>
                    <td>{label}</td>
                    <td>{count}×</td>
                    <td>{Math.round(count/moodEntries.length*100)}%</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </>
        )}
      </Card>

      {/* Medication adherence */}
      <SectionLabel>Medication Adherence</SectionLabel>
      <Card>
        {medProfiles.length === 0 ? (
          <div className="report-empty">No medications on record.</div>
        ) : (
          <table className="report-table">
            <thead><tr><th>Medication</th><th>Dose</th><th>Adherence</th></tr></thead>
            <tbody>
              {medProfiles.map(m => {
                const allDoses = meds.filter(d => d.name===m.name && d.dose===m.dose);
                const taken = allDoses.filter(d => d.taken).length;
                const total = allDoses.length;
                const pct = total ? Math.round(taken/total*100) : 0;
                const color = pct >= 80 ? "var(--positive)" : pct >= 50 ? "#D7A65C" : "#C0392B";
                return (
                  <tr key={m.id}>
                    <td><div>{m.name}</div>{m.purpose&&<div className="muted xsmall">{m.purpose}</div>}</td>
                    <td>{m.dose}</td>
                    <td>
                      <div style={{color, fontWeight:600}}>{total ? `${pct}%` : "—"}</div>
                      {total > 0 && <div className="adhere-bar"><div className="adhere-fill" style={{width:`${pct}%`,background:color}}/></div>}
                      {total > 0 && <div className="muted xsmall">{taken}/{total} doses</div>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </Card>

      {/* Side effects */}
      <SectionLabel>Side Effects — {sideEffects.length} logged</SectionLabel>
      <Card>
        {sideEffects.length === 0 ? (
          <div className="report-empty">No side effects logged in this period.</div>
        ) : (
          <table className="report-table">
            <thead><tr><th>Side Effect</th><th>Occurrences</th><th>Avg Severity</th></tr></thead>
            <tbody>
              {Object.entries(SECounts).sort((a,b)=>b[1].count-a[1].count).map(([name,d]) => (
                <tr key={name}>
                  <td>{name}</td>
                  <td>{d.count}×</td>
                  <td>{(d.totalSev/d.count).toFixed(1)}/10</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </Card>

      {/* Symptoms */}
      <SectionLabel>General Symptoms — {generalSymptoms.length} logged</SectionLabel>
      <Card>
        {generalSymptoms.length === 0 ? (
          <div className="report-empty">No symptoms logged in this period.</div>
        ) : (
          <table className="report-table">
            <thead><tr><th>Symptom</th><th>Occurrences</th><th>Avg Severity</th></tr></thead>
            <tbody>
              {Object.entries(symCounts).sort((a,b)=>b[1]-a[1]).map(([name,count]) => {
                const entries_for = generalSymptoms.filter(s=>s.name===name);
                const avgSev = (entries_for.reduce((t,s)=>t+s.sev,0)/count).toFixed(1);
                return (
                  <tr key={name}><td>{name}</td><td>{count}×</td><td>{avgSev}/10</td></tr>
                );
              })}
            </tbody>
          </table>
        )}
      </Card>

      {/* Activity */}
      <SectionLabel>Daily Activity — {rangeActivities.length} days logged</SectionLabel>
      <Card>
        {rangeActivities.length === 0 ? (
          <div className="report-empty">No activity logs in this period.</div>
        ) : (
          <table className="report-table">
            <thead><tr><th>Metric</th><th>Average</th><th>Range</th></tr></thead>
            <tbody>
              {[
                { label:"Sleep (hrs)", key:"sleep", fmt: v => v.toFixed(1) },
                { label:"Exercise (min)", key:"exercise", fmt: v => Math.round(v) },
                { label:"Stress (1–5)", key:"stress", fmt: v => v.toFixed(1) },
                { label:"Social (1–5)", key:"social", fmt: v => v.toFixed(1) },
                { label:"Appetite (1–5)", key:"appetite", fmt: v => v.toFixed(1) },
              ].map(row => {
                const vals = rangeActivities.map(a => a[row.key]||0);
                const avg = vals.reduce((t,v)=>t+v,0)/vals.length;
                const mn = Math.min(...vals), mx = Math.max(...vals);
                return (
                  <tr key={row.label}>
                    <td>{row.label}</td>
                    <td>{row.fmt(avg)}</td>
                    <td>{row.fmt(mn)} – {row.fmt(mx)}</td>
                  </tr>
                );
              })}
              <tr>
                <td>Caffeine days</td>
                <td>{rangeActivities.filter(a=>a.caffeine).length}</td>
                <td>of {rangeActivities.length}</td>
              </tr>
              <tr>
                <td>Alcohol days</td>
                <td>{rangeActivities.filter(a=>a.alcohol).length}</td>
                <td>of {rangeActivities.length}</td>
              </tr>
            </tbody>
          </table>
        )}
      </Card>

      {/* Journal notes */}
      {noteEntries.length > 0 && (
        <>
          <SectionLabel>Journal Notes — {noteEntries.length} entries</SectionLabel>
          <Card>
            {noteEntries.slice(0,5).map(e => (
              <div key={e.id} style={{marginBottom:10, paddingBottom:10, borderBottom:"1px solid var(--line)"}}>
                <div className="muted xsmall" style={{marginBottom:3}}>{new Date(e.t).toLocaleDateString([],{weekday:"short",month:"short",day:"numeric"})}</div>
                <div className="small">{(e.text||"").slice(0,200)}{(e.text||"").length>200?"…":""}</div>
              </div>
            ))}
            {noteEntries.length > 5 && <div className="muted xsmall">+ {noteEntries.length-5} more entries not shown</div>}
          </Card>
        </>
      )}

      {/* Actions */}
      <div className="report-actions" data-no-print>
        <button className="btn" onClick={emailReport} style={{background:"var(--surface)", border:"1px solid var(--line)"}}>
          <IconShare size={14}/> Email to Dr.
        </button>
        <button className="btn primary" onClick={printReport}>
          <IconShareTherapist size={14}/> Save as PDF
        </button>
      </div>
      <div style={{height:16}}/>
    </div>
  );
}
Object.assign(window, { ScreenReport });
</script>
<script type="text/babel">
/* Daily v2 — main app */
const { useState: useState_A, useEffect: useEffect_A } = React;

const PALETTES = {
  Sage: {
    bg: "#E8EBDD", surface: "#F7F6EE", text: "#22281F", muted: "#6F7568",
    accent: "#5F7A55", accentInk: "#F7F6EE", accentSoft: "#B5C5A6",
    line: "#D2D8C2", positive: "#7BA68B", info: "#7B96AF",
    haze: "radial-gradient(70% 60% at 20% 10%, #D2E2BC, transparent), radial-gradient(70% 60% at 90% 90%, #C3CFAB, transparent), #DAE0C7",
  },
  Petal: {
    bg: "#F0E5DC", surface: "#FBF4ED", text: "#2A1F26", muted: "#857481",
    accent: "#B5728A", accentInk: "#FBF4ED", accentSoft: "#E6BAC4",
    line: "#E5D3CC", positive: "#7AA68B", info: "#7B96AF",
    haze: "radial-gradient(70% 60% at 20% 10%, #F4D4D8, transparent), radial-gradient(70% 60% at 90% 90%, #E6BFCA, transparent), #ECD5D2",
  },
  Cocoa: {
    bg: "#EFE3D3", surface: "#FBF5EC", text: "#2A1F1B", muted: "#8B7B70",
    accent: "#B26A4A", accentInk: "#FBF5EC", accentSoft: "#E5B58B",
    line: "#E0D0B7", positive: "#7AA68B", info: "#7B96AF",
    haze: "radial-gradient(80% 70% at 30% 20%, #F6DDB6, transparent), radial-gradient(70% 60% at 80% 80%, #E5B594, transparent), #EFD9B7",
  },
  Dusk: {
    bg: "#1F1F26", surface: "#2A2A33", text: "#F1ECE4", muted: "#9892A0",
    accent: "#C7A5D6", accentInk: "#1F1F26", accentSoft: "#7E6889",
    line: "#3A3845", positive: "#9BC0A1", info: "#A6B8C9",
    haze: "radial-gradient(80% 70% at 30% 20%, #2C2B35, transparent), radial-gradient(70% 60% at 80% 80%, #1E1D24, transparent), #181820",
  },
};

function applyTheme(p) {
  const r = document.documentElement.style;
  Object.entries({
    "--bg": p.bg, "--surface": p.surface, "--text": p.text, "--muted": p.muted,
    "--accent": p.accent, "--accent-ink": p.accentInk, "--accent-soft": p.accentSoft,
    "--line": p.line, "--positive": p.positive, "--info": p.info, "--haze": p.haze,
  }).forEach(([k, v]) => r.setProperty(k, v));
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const palette = PALETTES[tweaks.palette] || PALETTES.Sage;
  useEffect_A(() => {
    applyTheme(palette);
    document.body.dataset.density = tweaks.density;
    document.body.dataset.radius = tweaks.radius;
  }, [palette, tweaks.density, tweaks.radius]);

  const [view, setView] = useState_A("today");
  const [prev, setPrev] = useState_A(null);
  const [viewProps, setViewProps] = useState_A({});
  const [onboarding, setOnboarding] = useState_A(!tweaks.onboarded);

  const NAV_ORDER = ["today","care","mood","journal","insights"];
  const dir = (() => {
    if (!prev) return 0;
    const a = NAV_ORDER.indexOf(prev), b = NAV_ORDER.indexOf(view);
    if (a === -1 || b === -1) return 0;
    return b > a ? 1 : -1;
  })();

  const go = (v, props = {}) => { setPrev(view); setView(v); setViewProps(props); };

  const [logOpen, setLogOpen] = useState_A(false);

  const [profile, setProfile] = useState_A({
    name: "",
    pronouns: "",
    email: "",
    conditions: [],
    therapist: "",
    therapistEmail: "",
    biometricLock: false,
    hidePreviews: false,
    analytics: false,
    crisisDetect: true,
    trustedContact: "",
    psychiatrist: "",
  });
  const [reminders, setReminders] = useState_A({
    checkin: true, checkinTime: "09:00",
    meds: true,
    quiet: true,
    adaptive: true,
  });

  const [meds, setMeds] = useState_A([]);
  const [mood, setMood] = useState_A(null);
  const [symptoms, setSymptoms] = useState_A([]);
  const [entries, setEntries] = useState_A([]);
  const [activities, setActivities] = useState_A([]);

  /* ── localStorage persistence ── */
  useEffect_A(() => {
    try {
      const d = JSON.parse(localStorage.getItem("daily-v2-data") || "{}");
      if (d.meds)       setMeds(d.meds.map(m => ({
        ...m,
        // Migrate old boolean taken → date-keyed object; clear stale boolean truthy objects
        taken: (m.taken && typeof m.taken === "object" && !Array.isArray(m.taken)) ? m.taken : {},
        takenAt: undefined,
      })));
      if (d.mood)       setMood(d.mood);
      if (d.symptoms)   setSymptoms(d.symptoms);
      if (d.entries)    setEntries(d.entries);
      if (d.activities) setActivities(d.activities);
      if (d.profile)    setProfile(p => ({...p, ...d.profile}));
      if (d.reminders)  setReminders(r => ({...r, ...d.reminders}));
    } catch(e) {}
  }, []);

  useEffect_A(() => {
    try {
      localStorage.setItem("daily-v2-data", JSON.stringify({ meds, mood, symptoms, entries, activities, profile, reminders }));
    } catch(e) {}
  }, [meds, mood, symptoms, entries, activities, profile, reminders]);

  const [toast, setToastT] = useToast();
  const undoLast = (t) => {
    if (t.kind === "med" && t.id) {
      const ds = new Date().toISOString().split("T")[0];
      setMeds(meds.map(m => {
        if (m.id !== t.id) return m;
        const prevDay = (typeof m.taken === "object" && m.taken && typeof m.taken[ds] === "object")
          ? { ...m.taken[ds] } : {};
        if (t.time) prevDay[t.time] = false;
        return { ...m, taken: { ...(m.taken || {}), [ds]: prevDay }, takenAt: undefined };
      }));
    }
    if (t.kind === "mood") setMood(null);
  };

  const screens = {
    today:    <ScreenToday name={profile.name} mood={mood} setMood={setMood} meds={meds} setMeds={setMeds} journalCount={entries.filter(e=>e.kind==="note").length} breathingMin={entries.filter(e=>e.kind==="toolkit").reduce((s,e)=>s+(e.dur||0),0)} go={go} toast={setToastT} openLog={() => setLogOpen(true)} openSettings={() => go("settings")}/>,
    care:     <ScreenCare go={go} meds={meds} setMeds={setMeds} symptoms={symptoms} setSymptoms={setSymptoms} activities={activities} setActivities={setActivities} toast={setToastT} initialTab={viewProps.tab || "Meds"} initialFocus={viewProps.focus}/>,
    mood:     <ScreenMood go={go} mood={mood} setMood={(m) => { setMood(m); setEntries([{ id: Date.now(), kind: "mood", ...m }, ...entries]); }} toast={setToastT}/>,
    journal:  <ScreenJournal go={go} entries={entries} setEntries={setEntries} mood={mood} openCompose={viewProps.compose}/>,
    insights: <ScreenInsights go={go} entries={entries} meds={meds} symptoms={symptoms} activities={activities}/>,
    report:   <ScreenReport go={go} entries={entries} meds={meds} symptoms={symptoms} activities={activities} profile={profile}/>,
    settings: <ScreenSettings go={go} profile={profile} setProfile={setProfile} reminders={reminders} setReminders={setReminders}/>,
    history:  <ScreenHistory go={go} entries={entries}/>,
  };

  if (onboarding) {
    return (
      <>
        <div className="ambient" style={{ background: palette.haze }}/>
        <div className="phone-wrap">
          <div className="phone">
            <div className="screen">
              <div className="notch"/>
              <div className="status-bar">
                <span>9:41</span>
                <span className="status-right">
                  <svg width="14" height="10" viewBox="0 0 14 10"><path d="M1 8.5l2-3 2 1 4-6 4 8" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>
                  <svg width="14" height="10" viewBox="0 0 14 10"><rect x="0.5" y="2" width="11" height="6" rx="1" fill="none" stroke="currentColor" strokeWidth="1"/><rect x="2" y="3.5" width="8" height="3" fill="currentColor"/><rect x="12" y="3.5" width="1.2" height="3" fill="currentColor"/></svg>
                </span>
              </div>
              <Onboarding
                defaultName={profile.name}
                onSignIn={() => {/* no backend yet — message shown inline */}}
                onComplete={(data) => {
                  setProfile(p => ({
                    ...p,
                    name: data.name || p.name,
                    email: data.email || p.email,
                    pronouns: data.pronouns || p.pronouns,
                    therapist: data.therapist || p.therapist,
                    therapistEmail: data.therapistEmail || p.therapistEmail,
                    conditions: data.reasons.length ? data.reasons : p.conditions,
                    biometricLock: data.biometricLock,
                  }));
                  setReminders(r => ({
                    ...r,
                    checkinTime: data.checkinTime || r.checkinTime,
                    meds: data.enableMedReminders,
                    checkin: data.enableCheckinReminder,
                  }));
                  setTweak("onboarded", true);
                  setOnboarding(false);
                }}
              />
            </div>
          </div>
        </div>
        <TweaksPanel title="Tweaks">
          <TweakButton label="Skip onboarding" onClick={() => { setTweak("onboarded", true); setOnboarding(false); }}/>
        </TweaksPanel>
      </>
    );
  }

  return (
    <>
      <div className="ambient" style={{ background: palette.haze }}/>
      <div className="phone-wrap">
        <div className="phone">
          <div className="screen">
            <div className="notch"/>
            <div className="status-bar">
              <span>9:41</span>
              <span className="status-right">
                <svg width="14" height="10" viewBox="0 0 14 10"><path d="M1 8.5l2-3 2 1 4-6 4 8" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>
                <svg width="14" height="10" viewBox="0 0 14 10"><rect x="0.5" y="2" width="11" height="6" rx="1" fill="none" stroke="currentColor" strokeWidth="1"/><rect x="2" y="3.5" width="8" height="3" fill="currentColor"/><rect x="12" y="3.5" width="1.2" height="3" fill="currentColor"/></svg>
              </span>
            </div>
            <div className={`view-stack dir-${dir}`} key={view}>
              {screens[view]}
            </div>
            <BottomNav active={view} go={go} onLog={() => setLogOpen(true)}/>
            <Toast toast={toast} onClose={() => setToastT(null)} onUndo={undoLast}/>
          </div>
        </div>
      </div>

      <LogSheet
        open={logOpen}
        onClose={() => setLogOpen(false)}
        go={go}
        onQuickMood={(m) => {
          const entry = { id: m.id, label: m.l, color: m.c, t: Date.now(), quick: true };
          setMood(entry);
          setEntries([{ id: Date.now(), kind: "mood", ...entry }, ...entries]);
          setToastT({ msg: `Logged "${m.l}"`, undo: true, kind: "mood" });
        }}
      />

      <TweaksPanel title="Tweaks">
        <TweakSection title="Theme">
          <TweakColorKeyed
            value={tweaks.palette}
            onChange={v => setTweak("palette", v)}
            options={[
              { key: "Sage",   swatches: ['#5F7A55','#B5C5A6','#E8EBDD'] },
              { key: "Petal",  swatches: ['#B5728A','#E6BAC4','#F0E5DC'] },
              { key: "Cocoa",  swatches: ['#B26A4A','#E5B58B','#EFE3D3'] },
              { key: "Dusk",   swatches: ['#C7A5D6','#2A2A33','#1F1F26'] },
            ]}
          />
        </TweakSection>
        <TweakSection title="Layout">
          <TweakRadio label="Density" value={tweaks.density} onChange={v => setTweak("density", v)} options={["Comfy","Compact"]}/>
          <TweakRadio label="Corners" value={tweaks.radius} onChange={v => setTweak("radius", v)} options={["Soft","Sharp"]}/>
        </TweakSection>
        <TweakSection title="Profile">
          <TweakText label="Name" value={tweaks.name} onChange={v => setTweak("name", v)} placeholder="Sarah"/>
        </TweakSection>
        <TweakSection title="Jump to">
          <div className="tweak-nav-grid">
            {[
              {k:"today",label:"Today"},{k:"care",label:"Care"},{k:"mood",label:"Mood"},
              {k:"journal",label:"Journal"},{k:"insights",label:"Insights"},
              {k:"report",label:"Report"},{k:"settings",label:"Settings"},{k:"history",label:"History"},
            ].map(s => (
              <button key={s.k} className={`tweak-nav-btn ${view===s.k?"active":""}`} onClick={() => go(s.k)}>{s.label}</button>
            ))}
          </div>
          <TweakButton label="Open log sheet" onClick={() => setLogOpen(true)}/>
          <TweakButton label="Replay onboarding" onClick={() => { setTweak("onboarded", false); setOnboarding(true); }} secondary/>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

/* TweakColor that stores keys, custom card layout */
function TweakColorKeyed({ value, onChange, options }) {
  return (
    <div className="tweak-row">
      <div className="tweak-color-row">
        {options.map(o => {
          const sel = value === o.key;
          return (
            <button key={o.key} className={`color-swatch ${sel?"selected":""}`} onClick={() => onChange(o.key)} title={o.key}>
              <span className="cs-main" style={{ background: o.swatches[0] }}/>
              <span className="cs-grid">
                {o.swatches.slice(1).map((c, j) => <span key={j} style={{ background: c }}/>)}
              </span>
              <span className="cs-name">{o.key}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* Bottom nav */
function BottomNav({ active, go, onLog }) {
  const items = [
    { k: "today",    label: "Today",    Ic: IconHome     },
    { k: "care",     label: "Care",     Ic: IconToolkit  },
    { k: "log",      label: "",         Ic: IconPlus, fab: true },
    { k: "journal",  label: "Journal",  Ic: IconJournal  },
    { k: "insights", label: "Insights", Ic: IconInsight  },
  ];
  return (
    <nav className="bnav">
      {items.map(it => {
        const Ic = it.Ic;
        if (it.fab) {
          return (
            <button key={it.k} className="bnav-fab" onClick={onLog} aria-label="Log something">
              <span className="bnav-fab-inner"><Ic size={22}/></span>
            </button>
          );
        }
        return (
          <button key={it.k} className={`bnav-btn ${active===it.k?"active":""}`} onClick={() => go(it.k)}>
            <Ic size={20}/>
            <span>{it.label}</span>
          </button>
        );
      })}
    </nav>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": "Sage",
  "density": "Comfy",
  "radius": "Soft",
  "onboarded": false
}/*EDITMODE-END*/;

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>

      "self.addEventListener('fetch',e=>{",
      "  e.respondWith(caches.open(CACHE).then(c=>",
      "    c.match(e.request).then(r=>r||fetch(e.request).then(res=>{",
      "      if(res&&res.ok)c.put(e.request,res.clone());return res;",
      "    }))",
      "  ));",
      "});"
    ].join('\n');
    var swBlob = new Blob([swCode], { type: 'application/javascript' });
    var swURL  = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swURL)
      .then(function(r){ console.log('[Daily] SW registered', r.scope); })
      .catch(function(e){ console.log('[Daily] SW skipped (needs HTTPS):', e.message); });
  }
})();
</script>
