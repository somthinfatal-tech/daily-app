<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Daily — for your mind</title>

<!-- PWA -->
<meta name="theme-color" content="#5F7A55"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Daily"/>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>

<style>
/* Daily v2 — stylesheet */

/* ====== Reset & base ====== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: 'Geist', 'Inter', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  background: var(--bg, #E8EBDD);
  color: var(--text, #22281F);
  --pad: 16px;
  --r: 14px;
}

body[data-density="Compact"] { --pad: 12px; font-size: 13px; }
body[data-radius="Sharp"] { --r: 6px; }

/* ====== Typography ====== */
.serif { font-family: 'Instrument Serif', Georgia, serif; }
.muted { color: var(--muted); }
.caps { text-transform: uppercase; letter-spacing: .06em; }
.xsmall { font-size: 11px; line-height: 1.4; }
.small { font-size: 12px; }
.regular { font-weight: 400; }
.large { font-size: 18px; }
.large-text { font-size: 15px; }
.xlarge { font-size: 22px; }
.xxlarge { font-size: 32px; }
.op85 { opacity: .85; }
.op6 { opacity: .6; }
.inline { display: inline; }

/* ====== Layout ====== */
.ambient {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none;
}

.phone-wrap {
  position: relative; z-index: 1;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; padding: 24px;
}

.phone {
  width: 390px;
  height: 844px;
  background: var(--bg);
  border-radius: 48px;
  box-shadow:
    0 40px 100px rgba(0,0,0,.30),
    0 0 0 1px rgba(0,0,0,.08),
    inset 0 0 0 1px rgba(255,255,255,.06);
  overflow: hidden;
  position: relative;
  display: flex; flex-direction: column;
  flex-shrink: 0;
}

.screen {
  flex: 1;
  display: flex; flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

.notch {
  width: 126px; height: 34px;
  background: #111;
  border-radius: 0 0 22px 22px;
  margin: 0 auto;
  flex-shrink: 0;
}

.status-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 4px 24px 6px;
  font-size: 12px; font-weight: 600;
  flex-shrink: 0;
}
.status-right { display: flex; gap: 6px; align-items: center; }

/* ====== View stack ====== */
.view-stack {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden;
  position: relative;
}

.view-stack.dir-1  { animation: slideInRight .22s cubic-bezier(.4,0,.2,1); }
.view-stack.dir--1 { animation: slideInLeft  .22s cubic-bezier(.4,0,.2,1); }

@keyframes slideInRight {
  from { transform: translateX(28px); opacity: 0; }
  to   { transform: translateX(0);    opacity: 1; }
}
@keyframes slideInLeft {
  from { transform: translateX(-28px); opacity: 0; }
  to   { transform: translateX(0);     opacity: 1; }
}

/* ====== Scroll ====== */
.scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 16px;
}
.scroll::-webkit-scrollbar { display: none; }

/* ====== Bottom Nav ====== */
.bnav {
  display: flex; align-items: stretch;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 8px 4px 20px;
  flex-shrink: 0;
}

.bnav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 2px;
  background: none; border: none;
  color: var(--muted); font-size: 10px; font-family: inherit;
  cursor: pointer; transition: color .15s;
}
.bnav-btn.active { color: var(--accent); }

.bnav-fab {
  flex: 1; display: flex; justify-content: center; align-items: flex-start;
  background: none; border: none; cursor: pointer; padding: 0;
}

.bnav-fab-inner {
  width: 52px; height: 52px;
  background: var(--accent); color: var(--accent-ink);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin-top: -20px;
  box-shadow: 0 4px 14px rgba(0,0,0,.22);
  transition: transform .15s, box-shadow .15s;
}
.bnav-fab:active .bnav-fab-inner {
  transform: scale(0.95);
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}

/* ====== Card ====== */
.card {
  background: var(--surface);
  border-radius: var(--r);
  padding: var(--pad);
  margin: 0 var(--pad) 10px;
  border: 1px solid var(--line);
}
.card-accent {
  background: var(--accent); color: var(--accent-ink);
  border-color: transparent;
}
.card-accent .muted { color: var(--accent-ink); opacity: .75; }
.card-soft { background: var(--accent-soft); border-color: transparent; }

/* ====== Page Header ====== */
.page-header {
  display: flex; align-items: center; gap: 8px;
  padding: 12px var(--pad) 8px;
  flex-shrink: 0;
}
.page-titles { flex: 1; text-align: center; min-width: 0; }
.page-title { font-size: 16px; font-weight: 600; }
.ph-action { display: flex; justify-content: flex-end; min-width: 36px; }

/* ====== Buttons ====== */
.icon-btn {
  width: 36px; height: 36px;
  background: none; border: none;
  cursor: pointer; color: inherit;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  transition: background .15s;
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--line); }

.btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; padding: 12px 16px;
  border: none; border-radius: var(--r);
  font-family: inherit; font-size: 14px; font-weight: 500;
  cursor: pointer; transition: opacity .15s, transform .1s;
}
.btn:disabled { opacity: .4; pointer-events: none; }
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--line); color: var(--text); }

.quiet-btn {
  background: none; border: none;
  font-family: inherit; font-size: 13px; color: var(--accent);
  cursor: pointer; padding: 4px 0;
  display: inline-flex; align-items: center; gap: 6px;
}
.quiet-btn.danger { color: #C97A7A; }

.link {
  background: none; border: none;
  font-family: inherit; font-size: 14px; color: var(--accent);
  cursor: pointer; text-decoration: none;
}
.link.danger { color: #C97A7A; }
.link.xsmall { font-size: 11px; }
.danger { color: #C97A7A; }

/* ====== Section Label ====== */
.section-label {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px var(--pad) 6px;
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .07em;
  color: var(--muted);
}
.section-right { font-weight: 400; text-transform: none; letter-spacing: 0; }

/* ====== Segment Control ====== */
.seg {
  display: flex; gap: 3px;
  background: var(--line);
  border-radius: calc(var(--r) + 2px);
  padding: 3px;
  margin: 0 var(--pad) 8px;
}
.seg.inline { margin: 8px 0; }
.seg-btn {
  flex: 1; padding: 7px 8px;
  background: none; border: none;
  border-radius: calc(var(--r) - 2px);
  font-family: inherit; font-size: 13px; font-weight: 500;
  cursor: pointer; color: var(--muted);
  transition: background .15s, color .15s;
  white-space: nowrap;
}
.seg-btn.active {
  background: var(--surface); color: var(--text);
  box-shadow: 0 1px 3px rgba(0,0,0,.1);
}

/* ====== Toast ====== */
.toast {
  position: absolute; bottom: 76px; left: var(--pad); right: var(--pad);
  background: var(--text); color: var(--bg);
  border-radius: var(--r); padding: 12px var(--pad);
  display: flex; align-items: center; gap: 8px;
  font-size: 13px;
  box-shadow: 0 4px 16px rgba(0,0,0,.2);
  animation: toastIn .2s ease;
  z-index: 10;
}
.toast-msg { flex: 1; }
.toast-undo {
  background: none; border: none;
  color: var(--accent-soft); font-family: inherit; font-size: 13px; font-weight: 500;
  cursor: pointer;
}
.toast-close {
  background: none; border: none; color: inherit; opacity: .6;
  cursor: pointer; display: flex;
}

@keyframes toastIn {
  from { transform: translateY(8px); opacity: 0; }
  to   { transform: translateY(0);   opacity: 1; }
}

/* ====== Sheet ====== */
.scrim {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0); pointer-events: none;
  transition: background .25s;
  z-index: 20;
}
.scrim.in { background: rgba(0,0,0,.35); pointer-events: all; }

.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--surface);
  border-radius: var(--r) var(--r) 0 0;
  transform: translateY(100%);
  transition: transform .3s cubic-bezier(.4,0,.2,1);
  z-index: 21;
  max-height: 88%;
  display: flex; flex-direction: column;
}
.sheet.in { transform: translateY(0); }

.sheet-handle {
  width: 36px; height: 4px;
  background: var(--line);
  border-radius: 2px;
  margin: 10px auto 4px;
  flex-shrink: 0;
}
.sheet-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px var(--pad) 10px;
  flex-shrink: 0;
}
.sheet-title { font-size: 18px; }

.sheet-body {
  overflow-y: auto;
  padding: 0 var(--pad) var(--pad);
  -webkit-overflow-scrolling: touch;
}
.sheet-body::-webkit-scrollbar { display: none; }

.sheet-divider {
  display: flex; align-items: center; gap: 10px;
  color: var(--muted); font-size: 11px;
  padding: 12px 0;
  text-transform: uppercase; letter-spacing: .06em;
}
.sheet-divider::before, .sheet-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--line);
}

/* ====== Log sheet ====== */
.quick-mood-row { margin-bottom: 8px; }
.quick-mood-label {
  font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .07em;
  color: var(--muted); margin-bottom: 8px;
}
.quick-mood-dots { display: flex; gap: 8px; justify-content: space-between; }

.log-list { list-style: none; display: flex; flex-direction: column; gap: 0; }
.log-row {
  display: flex; align-items: center; gap: 12px;
  width: 100%; background: none; border: none;
  font-family: inherit; text-align: left;
  padding: 10px 0; border-bottom: 1px solid var(--line);
  cursor: pointer; color: inherit;
  transition: opacity .15s;
}
.log-row:last-child { border-bottom: none; }
.log-row:active { opacity: .7; }
.log-ic {
  width: 38px; height: 38px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.log-meta { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.log-name { font-weight: 500; font-size: 14px; }
.log-note { line-height: 1.3; }

/* ====== Mood swatch ====== */
.mood-swatch-btn {
  background: none; border: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 4px;
}
.ms-dot {
  width: var(--sz, 28px); height: var(--sz, 28px);
  border-radius: 50%;
  background: var(--c, #999);
  display: block;
  transition: transform .15s, box-shadow .15s;
}
.mood-swatch-btn.selected .ms-dot {
  box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--c);
  transform: scale(1.1);
}
.ms-label { font-size: 10px; font-weight: 500; color: var(--muted); }
.mood-swatch-btn.ringless .ms-dot { box-shadow: none; }

/* ====== Sparkbars ====== */
.sparkbars { display: flex; align-items: flex-end; gap: 2px; width: 100%; }
.spark-col { flex: 1; display: flex; align-items: flex-end; height: 100%; }
.spark-bar { width: 100%; border-radius: 2px; min-height: 4px; }

/* ====== Utility ====== */
.row { display: flex; }
.between { justify-content: space-between; }
.baseline { align-items: baseline; }
.block { display: block; }
.padded { padding: var(--pad); }
.padded-x { padding-left: var(--pad); padding-right: var(--pad); }
.empty { padding: 24px var(--pad); text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6; }
.mood-prompt { margin-bottom: 4px; padding-top: 8px; line-height: 1.5; }

/* ====== Forms ====== */
.form { display: flex; flex-direction: column; gap: 8px; }
.form-l { display: block; margin-top: 4px; }
.form-note { margin-top: 4px; display: flex; align-items: center; gap: 4px; }

.text-input {
  width: 100%; padding: 10px 12px;
  background: var(--line); border: 1.5px solid transparent;
  border-radius: calc(var(--r) * 0.7);
  font-family: inherit; font-size: 14px; color: var(--text);
  transition: border-color .15s, background .15s;
}
.text-input:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--surface);
}

.text-area {
  width: 100%; padding: 10px 12px;
  background: var(--line); border: 1.5px solid transparent;
  border-radius: calc(var(--r) * 0.7);
  font-family: inherit; font-size: 14px; color: var(--text);
  resize: none; line-height: 1.5;
  transition: border-color .15s, background .15s;
}
.text-area:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--surface);
}
.text-area.big { font-size: 15px; line-height: 1.6; }

.slider {
  -webkit-appearance: none;
  width: 100%; height: 6px;
  background: linear-gradient(to right, var(--c, var(--accent)) var(--p, 50%), var(--line) var(--p, 50%));
  border-radius: 3px; border: none; outline: none; cursor: pointer;
}
.slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--c, var(--accent));
  box-shadow: 0 2px 6px rgba(0,0,0,.2);
  cursor: pointer;
}

/* Tags */
.tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  padding: 6px 12px; border-radius: 100px;
  background: var(--line); border: 2px solid transparent;
  font-family: inherit; font-size: 12px; font-weight: 500;
  cursor: pointer; color: var(--muted);
  transition: all .15s;
}
.tag.on { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }

/* ====== Today screen ====== */
.today-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 14px var(--pad) 10px;
}
.today-greeting { font-size: 26px; line-height: 1.2; margin-top: 2px; }

.today-mood-card { }
.today-mood-cta {
  border: 2px dashed var(--accent-soft);
  background: transparent;
}
.today-mood-dot {
  width: 48px; height: 48px; border-radius: 50%;
  flex-shrink: 0;
}

.today-meds-card { cursor: pointer; transition: opacity .15s; }
.today-meds-card:active { opacity: .8; }
.today-meds-dots { display: flex; gap: 6px; align-items: center; }
.today-med-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--line);
  transition: background .2s;
}
.today-med-dot.taken { background: var(--positive); }

.today-stats {
  display: flex; gap: 10px;
  padding: 0 var(--pad); margin-bottom: 0;
}
.today-stats .card {
  flex: 1; margin: 0 0 10px;
  text-align: center; cursor: pointer;
  transition: opacity .15s;
}
.today-stats .card:active { opacity: .8; }
.stat-num { font-size: 28px; line-height: 1.1; }

.today-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.action-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 14px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 100px;
  font-family: inherit; font-size: 13px; font-weight: 500;
  cursor: pointer; color: var(--text);
  transition: background .15s, transform .1s;
}
.action-chip:active { background: var(--line); transform: scale(0.97); }

/* ====== Mood screen ====== */
.wheel-wrap { padding: 4px var(--pad) 0; }
.mood-selected {
  display: flex; align-items: center; gap: 10px;
  padding: 4px var(--pad) 4px;
}
.mood-sel-dot {
  width: 20px; height: 20px; border-radius: 50%;
  flex-shrink: 0;
}

/* ====== Care screen ====== */
.adherence { }
.ad-pct-sym { font-size: 20px; font-weight: 300; opacity: .7; }
.ad-ring { flex-shrink: 0; }

.med-row-card { padding: 12px var(--pad); }
.med-row-inner { display: flex; align-items: center; gap: 12px; }
.check {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--line);
  background: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: background .15s, border-color .15s;
}
.check.on { background: var(--positive); border-color: var(--positive); color: white; }
.med-meta { flex: 1; min-width: 0; }
.med-name { font-weight: 500; font-size: 14px; }
.taken-stamp { color: var(--positive); margin-top: 2px; }
.more {
  background: none; border: none; color: var(--muted);
  cursor: pointer; padding: 4px; display: flex;
}
.med-actions {
  display: flex; flex-direction: column; gap: 4px;
  padding-top: 10px; border-top: 1px solid var(--line);
  margin-top: 10px;
}

.med-card { }
.med-card-name { font-weight: 600; font-size: 15px; }
.med-card-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 100px;
  background: var(--line); font-size: 11px; font-weight: 500;
}
.chip-dot { width: 6px; height: 6px; border-radius: 50%; }
.dot-good { background: var(--positive); }
.warn-row {
  display: flex; align-items: flex-start; gap: 6px;
  margin-top: 8px; font-size: 12px; color: var(--muted);
}

.symp { }
.symp-meta { flex: 1; min-width: 0; }
.sev-controls { display: flex; align-items: center; gap: 6px; }
.sev-btn {
  width: 28px; height: 28px;
  background: var(--line); border: none;
  border-radius: 50%; font-size: 16px; line-height: 1;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background .15s;
}
.sev-btn:active { background: var(--accent-soft); }
.sev-val { font-size: 15px; font-weight: 600; min-width: 36px; text-align: center; }
.sev-bar {
  height: 6px; background: var(--line);
  border-radius: 3px; margin-top: 10px;
  cursor: pointer; overflow: hidden;
}
.sev-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width .1s; }

.quick-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.qtag {
  padding: 5px 10px; border-radius: 100px;
  background: var(--surface); border: 1px solid var(--line);
  font-family: inherit; font-size: 12px; cursor: pointer;
  color: var(--text); transition: background .15s;
}
.qtag:active { background: var(--line); }

.tool-card { padding: 0; overflow: hidden; }
.tool-row {
  display: flex; align-items: center; gap: 12px;
  width: 100%; background: none; border: none;
  font-family: inherit; text-align: left;
  padding: 12px var(--pad); cursor: pointer; color: inherit;
  transition: background .15s;
}
.tool-row:active { background: var(--line); }
.tk-ic {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.tool-meta { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.tool-name { font-weight: 500; font-size: 14px; }
.tool-time { font-size: 12px; color: var(--muted); font-weight: 500; flex-shrink: 0; }

.crisis { border: 1px solid var(--line); }
.crisis-row {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 0;
}
.crisis-row + .crisis-row { border-top: 1px solid var(--line); }
.crisis-ic {
  width: 32px; height: 32px;
  background: #C97A7A22; color: #C97A7A;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.player-placeholder { text-align: center; padding: 32px 0; }

.breath-stage {
  display: flex; flex-direction: column; align-items: center;
  padding: 20px 0;
}
.breath-orb {
  width: 140px; height: 140px; border-radius: 50%;
  background: var(--accent-soft);
  transition: transform 1s ease-in-out;
  margin-bottom: 24px;
}
.breath-text { text-align: center; }

.ground-stage {
  display: flex; flex-direction: column; align-items: center;
  padding: 16px 0; text-align: center;
}
.ground-num { font-size: 80px; line-height: 1; color: var(--accent); }
.ground-what { margin-top: 8px; }
.ground-nav { display: flex; gap: 12px; margin-top: 24px; width: 100%; }
.ground-nav .btn { flex: 1; }
.ground-dots { display: flex; gap: 8px; margin-top: 20px; }
.gd { width: 6px; height: 6px; border-radius: 50%; background: var(--line); transition: background .2s; }
.gd.on { background: var(--accent); }

/* ====== Journal screen ====== */
.compose { margin-bottom: 10px; }

.timeline { display: flex; flex-direction: column; }
.t-row { display: flex; gap: 12px; }
.t-rail {
  display: flex; flex-direction: column; align-items: center;
  width: 16px; flex-shrink: 0; padding-top: 5px;
}
.t-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.t-line { flex: 1; width: 1px; background: var(--line); margin: 4px 0; min-height: 16px; }
.t-card { flex: 1; padding-bottom: 16px; min-width: 0; }
.entry-body { font-size: 14px; margin-top: 4px; line-height: 1.5; }
.entry-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.tag-readonly {
  padding: 2px 8px; border-radius: 100px;
  background: var(--line); font-size: 11px; color: var(--muted);
}
.entry-swatch { width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0; margin-top: 2px; }

/* ====== Insights screen ====== */
.insight-hero { }
.mood-bands {
  display: flex; border-radius: 4px; overflow: hidden;
  height: 8px; margin: 10px 0 6px; gap: 2px;
}
.mood-bands span { border-radius: 2px; }

.dow-row { display: flex; gap: 8px; align-items: flex-end; }
.dow { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.dow-bar {
  width: 100%; height: 64px;
  background: var(--line); border-radius: 4px;
  display: flex; align-items: flex-end; overflow: hidden;
}
.dow-bar span { width: 100%; border-radius: 4px; }
.dow-l { font-size: 10px; color: var(--muted); font-weight: 500; }

.insight { border-left: 3px solid var(--line); }
.insight.good { border-left-color: var(--positive); }
.insight.watch { border-left-color: var(--accent); }
.ins-pill {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.ins-pill.good { background: var(--positive); color: white; }
.ins-pill.watch { background: var(--accent); color: var(--accent-ink); }

.share-sent { display: flex; flex-direction: column; align-items: center; padding: 24px 0; text-align: center; }
.share-check {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--positive); color: white;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 16px;
}
.include-list { display: flex; flex-direction: column; gap: 0; margin: 8px 0; }
.include-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid var(--line);
  background: none; border-left: none; border-right: none; border-top: none;
  font-family: inherit; cursor: pointer; color: inherit; text-align: left;
  transition: opacity .15s;
}
.include-row:last-child { border-bottom: none; }
.incl-meta { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.incl-check {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background .15s, border-color .15s;
}
.incl-check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.share-foot { margin: 12px 0; display: flex; align-items: flex-start; gap: 6px; }

/* ====== Settings screen ====== */
.profile-summary { display: flex; align-items: center; gap: 12px; }
.profile-avatar {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--accent-soft);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0; color: var(--accent);
}

.settings-group { margin-bottom: 4px; }
.settings-card { padding: 0; }
.settings-row {
  display: flex; align-items: center; gap: 12px;
  width: 100%; background: none; border: none;
  font-family: inherit; cursor: pointer; color: inherit;
  padding: 12px var(--pad); text-align: left;
  border-bottom: 1px solid var(--line);
  transition: background .15s;
}
.settings-row:last-child { border-bottom: none; }
.settings-row:active { background: var(--line); }
.settings-ic {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--line); color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.settings-meta { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.settings-l { font-weight: 500; font-size: 14px; }
.settings-foot { text-align: center; padding: 24px var(--pad) 32px; }

.toggle {
  width: 44px; height: 26px;
  background: var(--line); border: none;
  border-radius: 13px; padding: 3px;
  cursor: pointer; transition: background .2s;
  display: flex; align-items: center;
  flex-shrink: 0;
}
.toggle.on { background: var(--accent); }
.toggle-knob {
  width: 20px; height: 20px; border-radius: 50%;
  background: white;
  transform: translateX(0);
  transition: transform .2s;
  display: block;
}
.toggle.on .toggle-knob { transform: translateX(18px); }

.rem-card { display: flex; flex-direction: column; gap: 8px; }
.time-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; }
.time-chip {
  padding: 5px 12px; border-radius: 100px;
  background: var(--surface); border: 1px solid var(--line);
  font-family: inherit; font-size: 12px; font-weight: 500;
  cursor: pointer; color: var(--muted);
  transition: all .15s;
}
.time-chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.rem-detail { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; border-top: 1px solid var(--line); }
.rem-row { display: flex; justify-content: space-between; font-size: 13px; }
.quiet-row { display: flex; align-items: center; gap: 16px; padding-top: 8px; }
.quiet-block { display: flex; flex-direction: column; gap: 2px; }
.quiet-line { flex: 1; height: 1px; background: var(--line); }
.onboard-toggle {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 12px 0; border-bottom: 1px solid var(--line);
}
.onboard-toggle:last-child { border-bottom: none; }
.callout {
  display: flex; align-items: flex-start; gap: 8px;
  background: var(--line); border-radius: var(--r);
  padding: 12px; font-size: 12px; color: var(--muted);
  margin: 8px 0; line-height: 1.5;
}

/* ====== History / Calendar ====== */
.month-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px var(--pad);
}
.month-name { }
.dow-head {
  display: grid; grid-template-columns: repeat(7, 1fr);
  padding: 0 var(--pad); margin-bottom: 4px;
  text-align: center;
  font-size: 11px; font-weight: 600; color: var(--muted);
}
.dow-head span { padding: 4px 0; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 0 var(--pad); }
.cal-cell {
  aspect-ratio: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: none; border: none;
  border-radius: calc(var(--r) / 2);
  cursor: pointer; font-family: inherit; font-size: 13px;
  gap: 2px; padding: 2px;
  transition: background .15s;
}
.cal-cell:active { background: var(--line); }
.cal-cell.today { background: var(--line); font-weight: 600; }
.cal-cell.sel { background: var(--accent); color: var(--accent-ink); }
.cal-cell.sel .cal-d { color: var(--accent-ink); }
.cal-empty { pointer-events: none; cursor: default; }
.cal-d { line-height: 1; }
.cal-dot { width: 5px; height: 5px; border-radius: 50%; }
.cal-legend { display: flex; gap: 12px; flex-wrap: wrap; padding: var(--pad); }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.legend-sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.about-card { margin-bottom: 10px; }

/* ====== Onboarding ====== */
.onboard-stage {
  flex: 1; display: flex; flex-direction: column;
  padding-bottom: 24px; overflow: hidden;
}
.onboard-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px var(--pad);
}
.onboard-dots { display: flex; gap: 5px; }
.od {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--line); transition: all .25s;
}
.od.on { background: var(--accent); width: 18px; border-radius: 3px; }
.od.done { background: var(--accent-soft); }
.skip-link {
  background: none; border: none;
  font-family: inherit; font-size: 13px; color: var(--muted);
  cursor: pointer;
}

.onboard-body {
  flex: 1; overflow-y: auto; padding: 0 var(--pad);
  -webkit-overflow-scrolling: touch;
}
.onboard-body::-webkit-scrollbar { display: none; }

.onboard-foot {
  padding: var(--pad); padding-top: 12px;
  display: flex; flex-direction: column;
}

.welcome {
  display: flex; flex-direction: column; align-items: center;
  text-align: center; padding: 20px 0;
}
.welcome-mark { margin-bottom: 20px; }
.welcome-title { font-size: 40px; margin-bottom: 8px; }
.welcome-tag { font-size: 18px; margin-bottom: 12px; font-style: italic; }
.welcome-sub { color: var(--muted); font-size: 14px; line-height: 1.6; }

.step { padding: 12px 0; }
.step-title { font-size: 26px; line-height: 1.2; margin-bottom: 8px; }
.step-sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; line-height: 1.5; }

.big-input {
  width: 100%; padding: 14px 0;
  background: none; border: none; border-bottom: 2px solid var(--line);
  font-family: 'Instrument Serif', Georgia, serif;
  font-size: 28px; color: var(--text);
  margin-bottom: 16px;
  transition: border-color .2s;
}
.big-input:focus { outline: none; border-bottom-color: var(--accent); }
.big-input::placeholder { color: var(--muted); }

.reason-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.reason {
  display: flex; flex-direction: column; align-items: flex-start;
  padding: 12px; border-radius: var(--r);
  background: var(--surface); border: 2px solid var(--line);
  font-family: inherit; cursor: pointer; text-align: left;
  transition: border-color .15s, background .15s;
  position: relative;
}
.reason.on { border-color: var(--accent); background: var(--accent-soft); }
.reason-glyph { font-size: 20px; margin-bottom: 4px; }
.reason-l { font-size: 13px; font-weight: 500; }
.reason-check {
  position: absolute; top: 8px; right: 8px;
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.reason-check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.promise-list { list-style: none; display: flex; flex-direction: column; gap: 12px; margin: 16px 0; }
.promise-list li { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 1.5; }
.promise-ic {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--accent-soft); color: var(--accent);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.consent-row {
  display: flex; align-items: flex-start; gap: 10px;
  background: none; border: none;
  font-family: inherit; font-size: 13px; text-align: left;
  cursor: pointer; padding: 12px 0; color: var(--text);
  line-height: 1.5;
}

.ready { }
.ready-mark { margin-bottom: 16px; }
.ready-summary {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); overflow: hidden; margin-top: 20px;
}
.rs-row {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 10px var(--pad); border-bottom: 1px solid var(--line);
}
.rs-row:last-child { border-bottom: none; }
.rs-l { font-size: 12px; color: var(--muted); }
.rs-v { font-size: 13px; font-weight: 500; text-align: right; flex: 1; margin-left: 12px; }

/* ====== Tweaks panel ====== */
.tweaks-fab {
  position: fixed; bottom: 24px; right: 24px;
  width: 44px; height: 44px;
  background: var(--text); color: var(--bg);
  border: none; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 100;
  box-shadow: 0 4px 12px rgba(0,0,0,.25);
  transition: transform .15s;
}
.tweaks-fab:hover { transform: scale(1.05); }

.tweaks-panel {
  position: fixed; right: 16px; bottom: 76px;
  width: 280px; max-height: 60vh;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: 0 8px 32px rgba(0,0,0,.2);
  z-index: 99;
  display: flex; flex-direction: column;
  overflow: hidden;
}

.tweaks-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px 10px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.tweaks-title {
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted);
}
.tweaks-close {
  background: none; border: none;
  font-size: 20px; cursor: pointer; color: var(--muted);
  line-height: 1; padding: 0; display: flex; align-items: center;
}

.tweaks-body { overflow-y: auto; padding: 8px 0; }
.tweaks-body::-webkit-scrollbar { display: none; }

.tweak-section {
  padding: 8px 16px;
  border-bottom: 1px solid var(--line);
}
.tweak-section:last-child { border-bottom: none; }
.tweak-section-title {
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .08em;
  color: var(--muted); margin-bottom: 8px;
}

.tweak-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 6px;
}
.tweak-row.col { flex-direction: column; align-items: flex-start; }
.tweak-label { font-size: 13px; font-weight: 500; }

.tweak-radio-group { display: flex; gap: 3px; }
.tweak-radio-btn {
  padding: 4px 10px; border-radius: 6px;
  background: var(--line); border: none;
  font-family: inherit; font-size: 12px; cursor: pointer; color: var(--muted);
  transition: all .15s;
}
.tweak-radio-btn.active { background: var(--accent); color: var(--accent-ink); }

.tweak-action-btn {
  width: 100%; padding: 7px 12px;
  background: var(--accent); color: var(--accent-ink);
  border: none; border-radius: 8px;
  font-family: inherit; font-size: 13px; font-weight: 500;
  cursor: pointer; margin-bottom: 4px;
  transition: opacity .15s;
}
.tweak-action-btn.secondary { background: var(--line); color: var(--text); }
.tweak-action-btn:active { opacity: .8; }

.tweak-input {
  width: 100%; padding: 7px 10px;
  background: var(--line); border: none;
  border-radius: 8px;
  font-family: inherit; font-size: 13px; color: var(--text);
}
.tweak-input:focus { outline: none; }

.tweak-nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 6px; }
.tweak-nav-btn {
  padding: 6px 8px;
  background: var(--line); border: none;
  border-radius: 6px;
  font-family: inherit; font-size: 12px; cursor: pointer;
  color: var(--muted); transition: all .15s;
}
.tweak-nav-btn.active { background: var(--accent); color: var(--accent-ink); }

.tweak-color-row { display: flex; gap: 6px; width: 100%; }
.color-swatch {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 6px 4px;
  background: none; border: 2px solid var(--line);
  border-radius: 8px; cursor: pointer; transition: border-color .15s;
}
.color-swatch.selected { border-color: var(--accent); }
.cs-main { width: 100%; height: 22px; border-radius: 4px; display: block; }
.cs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 100%; }
.cs-grid span { height: 10px; border-radius: 2px; display: block; }
.cs-name { font-size: 9px; color: var(--muted); font-weight: 500; }

/* ====== Responsive ====== */
@media (max-width: 440px) {
  .phone { width: 100%; height: 100dvh; border-radius: 0; }
  .phone-wrap { padding: 0; min-height: 100dvh; }
  .tweaks-panel { right: 8px; left: 8px; width: auto; }
}

</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js" crossorigin></script>

<script type="text/babel">
/* Daily v2 — Tweaks panel (design-time controls) */
const { useState: useState_T } = React;

function useTweaks(defaults) {
  const [tweaks, setTweaksRaw] = useState_T(() => {
    try {
      const saved = JSON.parse(localStorage.getItem("daily-tweaks") || "{}");
      return { ...defaults, ...saved };
    } catch { return { ...defaults }; }
  });
  const setTweak = (k, v) => {
    setTweaksRaw(prev => {
      const next = { ...prev, [k]: v };
      try { localStorage.setItem("daily-tweaks", JSON.stringify(next)); } catch {}
      return next;
    });
  };
  return [tweaks, setTweak];
}

function TweaksPanel({ title, children }) {
  const [open, setOpen] = useState_T(false);
  return (
    <>
      <button className="tweaks-fab" onClick={() => setOpen(o => !o)} title={title} aria-label="Open tweaks">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>
        </svg>
      </button>
      {open && (
        <div className="tweaks-panel">
          <div className="tweaks-header">
            <span className="tweaks-title">{title}</span>
            <button className="tweaks-close" onClick={() => setOpen(false)} aria-label="Close tweaks">×</button>
          </div>
          <div className="tweaks-body">{children}</div>
        </div>
      )}
    </>
  );
}

const TweakSection = ({ title, children }) => (
  <div className="tweak-section">
    <div className="tweak-section-title">{title}</div>
    {children}
  </div>
);

const TweakButton = ({ label, onClick, secondary }) => (
  <button className={`tweak-action-btn ${secondary ? "secondary" : ""}`} onClick={onClick}>{label}</button>
);

const TweakRadio = ({ label, value, onChange, options }) => (
  <div className="tweak-row">
    <span className="tweak-label">{label}</span>
    <div className="tweak-radio-group">
      {options.map(o => (
        <button key={o} className={`tweak-radio-btn ${value === o ? "active" : ""}`} onClick={() => onChange(o)}>{o}</button>
      ))}
    </div>
  </div>
);

const TweakText = ({ label, value, onChange, placeholder }) => (
  <div className="tweak-row col">
    <span className="tweak-label">{label}</span>
    <input
      className="tweak-input"
      value={value || ""}
      onChange={e => onChange(e.target.value)}
      placeholder={placeholder}
    />
  </div>
);

Object.assign(window, { useTweaks, TweaksPanel, TweakSection, TweakButton, TweakRadio, TweakText });

</script>
<script type="text/babel">
/* Lucide-style stroke icons, sized via fontSize / currentColor inheritance */
const Icon = ({ children, size = 20, sw = 2, ...rest }) => (
  <svg
    viewBox="0 0 24 24"
    width={size}
    height={size}
    fill="none"
    strokeLinecap="round"
    strokeLinejoin="round"
    {...rest}
    stroke="currentColor"
    strokeWidth={sw}
  >
    {children}
  </svg>
);

const IconHome = (p) => <Icon {...p}><path d="M3 11.5L12 4l9 7.5"/><path d="M5 10.5V20h14V10.5"/></Icon>;
const IconPill = (p) => <Icon {...p}><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-30 12 12)"/><path d="M8.5 7.5l7 7" /></Icon>;
const IconHeart = (p) => <Icon {...p}><path d="M12 20s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.5-7 10-7 10z"/></Icon>;
const IconLeaf = (p) => <Icon {...p}><path d="M4 20c0-8 6-14 16-14 0 10-6 16-14 16-2 0-2-2-2-2z"/><path d="M4 20l9-9"/></Icon>;
const IconRun = (p) => <Icon {...p}><circle cx="13" cy="4.5" r="1.6"/><path d="M5.5 13l3-3 3 1 2 4 3 2"/><path d="M4 19l3-2 2-5"/></Icon>;
const IconChart = (p) => <Icon {...p}><path d="M3 20h18"/><path d="M6 16V9"/><path d="M11 16V5"/><path d="M16 16v-4"/><path d="M21 16v-8"/></Icon>;
const IconBack = (p) => <Icon {...p} sw={2.4}><path d="M15 5l-7 7 7 7"/></Icon>;
const IconCheck = (p) => <Icon {...p} sw={2.6}><path d="M4 12l5 5L20 6"/></Icon>;
const IconPlus = (p) => <Icon {...p} sw={2.4}><path d="M12 5v14M5 12h14"/></Icon>;
const IconSearch = (p) => <Icon {...p}><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></Icon>;
const IconCamera = (p) => <Icon {...p}><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></Icon>;

<script type="text/babel">
/* Daily v2 — progressive mood wheel
   Interaction model:
   1. Default view: 6 cores in inner ring, outer secondaries dimmed
   2. Tap a core: it "blooms" — that core's secondaries become fully visible,
      others fade to thin ghost ring
   3. Tap an outer secondary: selected (held with subtle border + filled center)
   4. Tap center: collapse back to overview / clear selection */

const MOOD_CORES = [
  { id: "joyful",  label: "Joyful",  color: "#D7A65C", secondary: ["Hopeful", "Playful", "Proud", "Content", "Grateful", "Open"] },
  { id: "tender",  label: "Tender",  color: "#C97A7A", secondary: ["Loving", "Soft", "Caring", "Warm", "Trusting", "Held"] },
  { id: "calm",    label: "Calm",    color: "#7AA68B", secondary: ["Peaceful", "Rested", "Steady", "Settled", "Quiet", "Centered"] },
  { id: "sad",     label: "Sad",     color: "#7B8FA8", secondary: ["Lonely", "Hurt", "Heavy", "Empty", "Tired", "Withdrawn"] },
  { id: "anxious", label: "Anxious", color: "#9C7BA7", secondary: ["Worried", "Nervous", "Restless", "Overwhelmed", "Scared", "Trapped"] },
  { id: "angry",   label: "Angry",   color: "#B86A55", secondary: ["Frustrated", "Irritated", "Resentful", "Provoked", "Bitter", "Hostile"] },
];

function MoodWheel({ value, onChange }) {
  const N = MOOD_CORES.length;
  const M = 6;
  const innerR = 56;
  const outerR = 158;
  const slice = (2 * Math.PI) / N;
  const outerSlice = (2 * Math.PI) / (N * M);

  const polar = (r, a) => [Math.cos(a) * r, Math.sin(a) * r];
  const arcPath = (r0, r1, a0, a1) => {
    const [x0, y0] = polar(r1, a0);
    const [x1, y1] = polar(r1, a1);
    const [x2, y2] = polar(r0, a1);
    const [x3, y3] = polar(r0, a0);
    const large = a1 - a0 > Math.PI ? 1 : 0;
    return `M ${x0} ${y0} A ${r1} ${r1} 0 ${large} 1 ${x1} ${y1} L ${x2} ${y2} A ${r0} ${r0} 0 ${large} 0 ${x3} ${y3} Z`;
  };

  const start = -Math.PI / 2 - slice / 2;
  const focused = value?.coreId || null;

  const tapCore = (coreId) => {
    if (focused === coreId) {
      onChange(null);
    } else {
      onChange({ coreId, secondary: null });
    }
  };

  const tapSecondary = (coreId, sec) => onChange({ coreId, secondary: sec });

  return (
    <svg viewBox="-180 -180 360 360" style={{ width: "100%", maxWidth: 320, height: "auto", display: "block" }}>
      <defs>
        <radialGradient id="wheelGlow" cx="50%" cy="50%" r="50%">
          <stop offset="40%" stopColor="white" stopOpacity="0"/>
          <stop offset="100%" stopColor="white" stopOpacity="0.08"/>
        </radialGradient>
      </defs>

      {/* Outer ring */}
      {MOOD_CORES.map((core, ci) => {
        const a0Core = start + ci * slice;
        const isFocused = focused === core.id;
        const isOther = focused && !isFocused;
        return core.secondary.map((sec, si) => {
          const a0 = a0Core + si * outerSlice;
          const a1 = a0 + outerSlice;
          const selected = value && value.coreId === core.id && value.secondary === sec;
          const mid = (a0 + a1) / 2;
          const [tx, ty] = polar((innerR + outerR) / 2 + 4, mid);
          const rotDeg = (mid * 180) / Math.PI + 90;
          const flip = rotDeg > 90 && rotDeg < 270;
          let opacity = 0.55;
          if (isFocused) opacity = selected ? 1 : 0.85;
          if (isOther) opacity = 0.14;
          const r0 = innerR + (isFocused ? 4 : 6);
          const r1 = outerR + (isFocused ? 4 : 0);
          return (
            <g key={core.id + sec} onClick={() => tapSecondary(core.id, sec)} style={{ cursor: "pointer", transition: "opacity 320ms" }}>
              <path
                d={arcPath(r0, r1, a0 + 0.005, a1 - 0.005)}
                fill={core.color}
                opacity={opacity}
                stroke={selected ? "var(--surface)" : "transparent"}
                strokeWidth={selected ? 2 : 0}
                style={{ transition: "opacity 320ms, filter 320ms" }}
                filter={selected ? "drop-shadow(0 2px 6px rgba(0,0,0,.18))" : undefined}
              />
              {(isFocused || !focused) && (
                <text
                  x={tx} y={ty}
                  transform={`rotate(${flip ? rotDeg + 180 : rotDeg} ${tx} ${ty})`}
                  fontSize={isFocused ? "9" : "7.5"}
                  fontWeight={isFocused ? "600" : "500"}
                  fill="#FBF5EC"
                  textAnchor="middle"
                  dominantBaseline="middle"
                  style={{ pointerEvents: "none", letterSpacing: 0.2, transition: "font-size 320ms" }}
                  opacity={isOther ? 0 : 1}
                >{sec}</text>
              )}
            </g>
          );
        });
      })}

      {/* Soft inner glow ring */}
      <circle cx="0" cy="0" r={innerR + 1} fill="url(#wheelGlow)" pointerEvents="none"/>

      {/* Inner ring — cores */}
      {MOOD_CORES.map((core, ci) => {
        const a0 = start + ci * slice;
        const a1 = a0 + slice;
        const mid = (a0 + a1) / 2;
        const [tx, ty] = polar(innerR * 0.6, mid);
        const isFocused = focused === core.id;
        const dim = focused && !isFocused;
        return (
          <g key={core.id} onClick={() => tapCore(core.id)} style={{ cursor: "pointer", transition: "opacity 320ms" }}>
            <path
              d={arcPath(0, innerR, a0, a1)}
              fill={core.color}
              opacity={dim ? 0.35 : 1}
              stroke="var(--surface)"
              strokeWidth={1.5}
              style={{ transition: "opacity 320ms" }}
            />
            <text
              x={tx} y={ty}
              fontSize="10"
              fontWeight="600"
              fill="#FBF5EC"
              textAnchor="middle"
              dominantBaseline="middle"
              style={{ pointerEvents: "none", letterSpacing: 0.3 }}
              opacity={dim ? 0.7 : 1}
            >{core.label}</text>
          </g>
        );
      })}

      {/* Center hint */}
      <circle cx="0" cy="0" r="8" fill="var(--surface)" stroke="var(--line)" strokeWidth="1"
        onClick={() => onChange(null)} style={{ cursor: focused ? "pointer" : "default" }}/>
    </svg>
  );
}

Object.assign(window, { MoodWheel, MOOD_CORES });

</script>
<script type="text/babel">
/* Daily v2 — shared UI primitives */
const { useState, useEffect, useRef } = React;

const Card = ({ children, accent, soft, style, className = "", ...rest }) => (
  <div
    className={`card ${accent ? "card-accent" : ""} ${soft ? "card-soft" : ""} ${className}`}
    style={style}
    {...rest}
  >{children}</div>
);

const PageHeader = ({ title, onBack, action, subtitle }) => (
  <header className="page-header">
    {onBack ? (
      <button className="icon-btn" onClick={onBack} aria-label="Back"><IconBack size={18}/></button>
    ) : <div style={{width:36}}/>}

      {subtitle && <div className="muted xsmall">{subtitle}</div>}

    <div className="ph-action">{action || <div style={{width:36}}/>}</div>

);

const SectionLabel = ({ children, right }) => (
  <div className="section-label">
    <span>{children}</span>
    {right && <span className="section-right">{right}</span>}
  </div>
);

const Sparkbars = ({ values, height = 44, accent = "var(--accent)", muted = "var(--accent-soft)", highlightLast = true }) => (
  <div className="sparkbars" style={{ height }}>
    {values.map((v, i) => (
      <div key={i} className="spark-col">
        <div className="spark-bar" style={{
          height: `${Math.max(v * 100, 6)}%`,
          background: highlightLast && i === values.length - 1 ? accent : muted,
        }}/>
      </div>
    ))}
  </div>
);

/* Mood swatch sized variants */
const MoodSwatch = ({ color, size = 28, label, selected, onClick, ringless }) => (
  <button
    className={`mood-swatch-btn ${selected ? "selected" : ""} ${ringless ? "ringless" : ""}`}
    onClick={onClick}
    style={{ "--c": color, "--sz": size + "px" }}
    aria-label={label}
    title={label}
  >
    <span className="ms-dot"/>
    {label && <span className="ms-label">{label}</span>}
  </button>
);

/* Toast — undo on log */
function useToast() {
  const [toast, setToast] = useState(null);
  const t = useRef();
  useEffect(() => {
    if (!toast) return;
    clearTimeout(t.current);
    t.current = setTimeout(() => setToast(null), 3500);
    return () => clearTimeout(t.current);
  }, [toast]);
  return [toast, setToast];
}
const Toast = ({ toast, onClose, onUndo }) => {
  if (!toast) return null;
  return (
    <div className="toast">
      <div className="toast-msg">{toast.msg}</div>
      {toast.undo && <button className="toast-undo" onClick={() => { onUndo && onUndo(toast); onClose(); }}>Undo</button>}
      <button className="toast-close" onClick={onClose} aria-label="Dismiss"><IconClose size={14}/></button>
    </div>
  );
};

/* Bottom sheet primitive */
function Sheet({ open, onClose, title, children }) {
  return (
    <>
      <div className={`scrim ${open ? "in" : ""}`} onClick={onClose}/>
      <div className={`sheet ${open ? "in" : ""}`}>
        <div className="sheet-handle"/>
        {title && (
          <div className="sheet-head">
            <h3 className="serif sheet-title">{title}</h3>
            <button className="icon-btn" onClick={onClose} aria-label="Close"><IconClose size={16}/></button>
          </div>
        )}
        <div className="sheet-body">{children}</div>
      </div>
    </>
  );
}

/* FAB Log Sheet — quick-log picker */
function LogSheet({ open, onClose, go, onQuickMood }) {
  const items = [
    { id: "mood",    Ic: IconHeart,    name: "Mood check-in", note: "Open the feelings wheel",            color: "#C97A7A" },
    { id: "journal", Ic: IconJournal,  name: "Journal entry",  note: "Free-write what's on your mind",     color: "#7AA68B" },
    { id: "med",     Ic: IconPill,     name: "Medication",     note: "Mark a dose taken",                  color: "#D7A65C" },
    { id: "symptom", Ic: IconWave,     name: "Symptom",        note: "Anxiety, fog, panic, fatigue…",      color: "#9C7BA7" },
    { id: "sleep",   Ic: IconMoon,     name: "Sleep",          note: "Last night's hours & quality",       color: "#7B8FA8" },
    { id: "care",    Ic: IconShield,   name: "Self-care",      note: "A moment of grounding or movement",  color: "#7AA68B" },
  ];

  const handleQuick = (m) => { onQuickMood(m); onClose(); };

  const handleGo = (id) => {
    onClose();
    setTimeout(() => {
      if (id === "mood") go("mood");
      else if (id === "journal") go("journal", { compose: true });
      else if (id === "med") go("care", { tab: "Meds" });
      else if (id === "symptom") go("care", { tab: "Symptoms" });
      else if (id === "sleep") go("care", { tab: "Toolkit" });
      else if (id === "care") go("care", { tab: "Toolkit" });
    }, 180);
  };

  return (
    <Sheet open={open} onClose={onClose} title="Take a moment">
      <div className="quick-mood-row">
        <div className="quick-mood-label">Quick mood</div>
        <div className="quick-mood-dots">
          {[
            { id: "rough", c: "#9C7BA7", l: "Rough" },
            { id: "low",   c: "#7B8FA8", l: "Low"   },
            { id: "okay",  c: "#C9C2A0", l: "Okay"  },
            { id: "good",  c: "#7AA68B", l: "Good"  },
            { id: "great", c: "#D7A65C", l: "Great" },
          ].map(m => (
            <MoodSwatch key={m.id} color={m.c} label={m.l} size={36} onClick={() => handleQuick(m)}/>
          ))}
        </div>
      </div>

      <div className="sheet-divider"><span>or, log something specific</span></div>

      <ul className="log-list">
        {items.map(it => {
          const Ic = it.Ic;
          return (
            <li key={it.id}>
              <button className="log-row" onClick={() => handleGo(it.id)}>
                <span className="log-ic" style={{ background: it.color + "22", color: it.color }}><Ic size={18}/></span>
                <span className="log-meta">
                  <span className="log-name">{it.name}</span>
                  <span className="log-note muted xsmall">{it.note}</span>
                </span>
                <IconChevR size={14}/>
              </button>
            </li>
          );
        })}
      </ul>
    </Sheet>
  );
}

Object.assign(window, {
  Card, PageHeader, SectionLabel, Sparkbars, MoodSwatch, Sheet,
  useToast, Toast, LogSheet,
});

  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;

}

function ScreenMood({ go, mood, setMood, toast }) {

<script type="text/babel">
/* Daily v2 — Care screen (Meds, Symptoms, Toolkit) */
const { useState: useState_C, useEffect: useEffect_C } = React;

function ScreenCare({ go, meds, setMeds, symptoms, setSymptoms, toast, initialTab = "Meds", initialFocus = null }) {
  const [tab, setTab] = useState_C(initialTab);
  useEffect_C(() => { setTab(initialTab); }, [initialTab]);
  return (
    <div className="scroll" data-screen-label="Care">
      <PageHeader title="Care" onBack={() => go("today")}/>
      <div className="seg">
        {["Meds","Symptoms","Toolkit"].map(t => (
          <button key={t} className={`seg-btn ${tab===t?"active":""}`} onClick={() => setTab(t)}>{t}</button>
        ))}
      </div>
      {tab === "Meds"     && <PaneMeds meds={meds} setMeds={setMeds} toast={toast}/>}
      {tab === "Symptoms" && <PaneSymptoms items={symptoms} setItems={setSymptoms} toast={toast}/>}
      {tab === "Toolkit"  && <PaneToolkit focus={initialFocus}/>}
    </div>
  );
}

/* ===== Meds ===== */
const BLANK_MED = { name: "", dose: "", time: "8:00 AM", note: "", purpose: "", warn: "" };

function PaneMeds({ meds, setMeds, toast }) {
  const [editing, setEditing]       = useState_C(null);
  const [adding, setAdding]         = useState_C(false);
  const [newMed, setNewMed]         = useState_C(BLANK_MED);
  const [confirmDel, setConfirmDel] = useState_C(null);

  const taken  = meds.filter(m => m.taken).length;
  const adh14  = 92;

  /* ── mark taken / untaken ── */
  const onCheck = (id) => {
    const m = meds.find(x => x.id === id);
    setMeds(meds.map(x => x.id === id ? { ...x, taken: !x.taken, takenAt: !x.taken ? new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}) : undefined } : x));
    if (m && !m.taken) toast({ msg: `${m.name} marked taken`, undo: true, kind: "med", id });
  };

  /* ── add new medication ── */
  const saveMed = () => {
    if (!newMed.name.trim() || !newMed.dose.trim() || !newMed.time.trim()) return;
    const id = Date.now();
    setMeds([...meds, { id, ...newMed, taken: false }]);
    toast({ msg: `${newMed.name} added` });
    setAdding(false);
    setNewMed(BLANK_MED);
  };

  /* ── remove medication ── */
  const removeMed = (id) => {
    const m = meds.find(x => x.id === id);
    setMeds(meds.filter(x => x.id !== id));
    setConfirmDel(null);
    setEditing(null);
    toast({ msg: `${m?.name || "Medication"} removed` });
  };

  /* ── unique profiles for "Your medications" section ── */
  const profiles = [...new Map(meds.map(m => [`${m.name}|${m.dose}`, m])).values()];

  return (
    <>
      {/* ── Adherence card ── */}
      <Card accent className="adherence">
        <div className="row between" style={{alignItems:"center"}}>
          <div>
            <div className="muted xsmall caps op85">14-day adherence</div>
            <div className="row baseline" style={{gap:6, marginTop:4}}>
              <div className="serif xxlarge">{adh14}</div>
              <div className="ad-pct-sym">%</div>
            </div>
            <div className="muted small op85">{taken}/{meds.length} due today</div>
          </div>
          <div className="ad-ring">
            <svg viewBox="0 0 36 36" width="78" height="78">
              <circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,.25)" strokeWidth="2.5"/>
              <circle cx="18" cy="18" r="15" fill="none" stroke="#FBF5EC" strokeWidth="2.5"
                strokeDasharray={`${(adh14/100)*94.2} 94.2`} strokeLinecap="round" transform="rotate(-90 18 18)"/>
            </svg>
          </div>
        </div>
        <Sparkbars values={[1,1,.7,1,1,1,1,1,.45,1,1,1,1,.9]} accent="#FBF5EC" muted="#FBF5EC55" height={32}/>
      </Card>

      {/* ── Today's doses ── */}
      <SectionLabel right={<span className="muted xsmall">{taken}/{meds.length} taken</span>}>Today</SectionLabel>

      {meds.length === 0 && (
        <div className="empty">No medications scheduled. Tap "Add medication" below to get started.</div>
      )}

      {meds.map(m => (
        <Card key={m.id} className="med-row-card">
          <div className="med-row-inner">
            <button className={`check ${m.taken?"on":""}`} onClick={() => onCheck(m.id)} aria-label={m.taken?"Mark untaken":"Mark taken"}>
              {m.taken && <IconCheck size={14}/>}
            </button>
            <div className="med-meta">
              <div className="med-name">{m.name} <span className="muted regular">{m.dose}</span></div>
              <div className="muted xsmall">{m.time}{m.note ? ` · ${m.note}` : ""}</div>
              {m.taken && <div className="taken-stamp xsmall">✓ Taken at {m.takenAt || m.time}</div>}
            </div>
            <button className="more" onClick={() => setEditing(editing === m.id ? null : m.id)} aria-label="Options">
              <IconMore size={16}/>
            </button>
          </div>

          {editing === m.id && (
            <div className="med-actions">
              <button className="quiet-btn" onClick={() => { onCheck(m.id); setEditing(null); }}>
                <IconClock size={13}/> Took at a different time
              </button>
              <button className="quiet-btn" onClick={() => { toast({ msg: "Snoozed 15 min" }); setEditing(null); }}>
                <IconBell size={13}/> Snooze 15 min
              </button>
              <button className="quiet-btn danger" onClick={() => { setConfirmDel(m.id); setEditing(null); }}>
                <IconClose size={13}/> Remove this medication
              </button>
              <button className="quiet-btn" onClick={() => setEditing(null)}>
                Cancel
              </button>
            </div>
          )}
        </Card>
      ))}

      {/* ── Medication profiles ── */}
      <SectionLabel right={
        <button className="link xsmall" onClick={() => setAdding(true)}>+ Add</button>
      }>Your medications</SectionLabel>

      {profiles.length === 0 && (
        <div className="empty">No medications added yet.</div>
      )}

      {profiles.map((m) => (
        <Card key={`${m.name}|${m.dose}`} className="med-card">
          <div className="row between" style={{alignItems:"flex-start"}}>
            <div style={{flex:1, minWidth:0}}>
              <div className="med-card-name">{m.name} <span className="muted regular">{m.dose}</span></div>
              <div className="muted xsmall">{m.purpose || "No purpose noted"} · {m.time}</div>
            </div>
            <button className="more" onClick={() => setConfirmDel(m.id)} aria-label="Remove">
              <IconClose size={15}/>
            </button>
          </div>
          <div className="med-card-chips" style={{marginTop:8}}>
            <span className="chip"><span className="chip-dot dot-good"/>{adh14}% adherence</span>
            <span className="chip"><IconClock size={11}/> {m.supply || "—"} days left</span>
          </div>
          {m.warn && (
            <div className="warn-row"><IconAlert size={13}/> <span>{m.warn}</span></div>
          )}
        </Card>
      ))}

      <div className="block padded">
        <button className="btn primary" onClick={() => setAdding(true)}>
          <IconPlus size={14}/> Add medication
        </button>
      </div>

      {/* ── Add medication sheet ── */}
      <Sheet open={adding} onClose={() => { setAdding(false); setNewMed(BLANK_MED); }} title="Add medication">
        <div className="form" style={{paddingBottom: 8}}>
          <label className="form-l caps xsmall muted">Medication name *</label>
          <input className="text-input" placeholder="e.g. Sertraline" value={newMed.name}
            onChange={e => setNewMed({...newMed, name: e.target.value})} autoFocus/>

          <label className="form-l caps xsmall muted">Dose *</label>
          <input className="text-input" placeholder="e.g. 50mg" value={newMed.dose}
            onChange={e => setNewMed({...newMed, dose: e.target.value})}/>

          <label className="form-l caps xsmall muted">Time / schedule *</label>
          <input className="text-input" placeholder="e.g. 8:00 AM" value={newMed.time}
            onChange={e => setNewMed({...newMed, time: e.target.value})}/>

          <label className="form-l caps xsmall muted">Notes</label>
          <input className="text-input" placeholder="e.g. with breakfast, as needed"
            value={newMed.note} onChange={e => setNewMed({...newMed, note: e.target.value})}/>

          <label className="form-l caps xsmall muted">Purpose (optional)</label>
          <input className="text-input" placeholder="e.g. For anxiety & depression"
            value={newMed.purpose} onChange={e => setNewMed({...newMed, purpose: e.target.value})}/>

          <label className="form-l caps xsmall muted">Warnings / side effects (optional)</label>
          <input className="text-input" placeholder="e.g. Take with food"
            value={newMed.warn} onChange={e => setNewMed({...newMed, warn: e.target.value})}/>

          <button className="btn primary" style={{marginTop: 8}}
            disabled={!newMed.name.trim() || !newMed.dose.trim() || !newMed.time.trim()}
            onClick={saveMed}>
            <IconCheck size={14}/> Save medication
          </button>
        </div>
      </Sheet>

      {/* ── Confirm remove sheet ── */}
      <Sheet open={!!confirmDel} onClose={() => setConfirmDel(null)} title="Remove medication?">
        <div style={{paddingBottom: 8}}>
          <p className="muted small" style={{marginBottom: 16, lineHeight: 1.6}}>
            <strong>{meds.find(m => m.id === confirmDel)?.name}</strong> will be removed from your list and today's schedule. This can't be undone.
          </p>
          <button className="btn primary" style={{background:"#C97A7A", marginBottom: 8}}
            onClick={() => removeMed(confirmDel)}>
            <IconClose size={14}/> Remove
          </button>
          <button className="btn ghost" onClick={() => setConfirmDel(null)}>Cancel</button>
        </div>
      </Sheet>
    </>
  );
}

/* ===== Symptoms ===== */
function PaneSymptoms({ items, setItems, toast }) {
  const [adding, setAdding] = useState_C(false);
  const [newSym, setNewSym] = useState_C({ name: "", sev: 5, note: "" });

  const QUICK = ["Anxiety","Panic","Brain fog","Intrusive thoughts","Low motivation","Restless","Irritable","Couldn't sleep"];

  const adjust = (id, delta) => {
    setItems(items.map(s => s.id === id ? {...s, sev: Math.max(1, Math.min(10, s.sev + delta))} : s));
  };

  const addQuick = (name) => {
    setItems([{ id: Date.now(), name, sev: 5, note: "", time: new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}) }, ...items]);
    toast({ msg: `Logged: ${name}`, undo: true });
  };

  return (
    <>
      <div className="padded-x muted small mood-prompt">
        How is your body and mind today? Drag the bar to adjust intensity.
      </div>

      <SectionLabel>Quick log</SectionLabel>
      <div className="quick-tags padded-x">
        {QUICK.map(q => (
          <button key={q} className="qtag" onClick={() => addQuick(q)}>+ {q}</button>
        ))}
      </div>

      <SectionLabel>Today</SectionLabel>
      {items.length === 0 && (
        <div className="empty">Nothing logged yet today. Use the quick chips above, or tap + for detail.</div>
      )}
      {items.map(it => (
        <Card key={it.id} className="symp">
          <div className="row between">
            <div className="symp-meta">
              <div className="med-name">{it.name}</div>
              <div className="muted xsmall">{it.time}{it.note ? ` · "${it.note}"` : ""}</div>
            </div>
            <div className="sev-controls">
              <button className="sev-btn" onClick={() => adjust(it.id, -1)} aria-label="Less">−</button>
              <div className="sev-val">{it.sev}<span className="muted xsmall">/10</span></div>
              <button className="sev-btn" onClick={() => adjust(it.id, +1)} aria-label="More">+</button>
            </div>
          </div>
          <div className="sev-bar" onClick={(e) => {
            const r = e.currentTarget.getBoundingClientRect();
            const p = Math.max(1, Math.min(10, Math.round(((e.clientX - r.left) / r.width) * 10)));
            setItems(items.map(s => s.id === it.id ? {...s, sev: p} : s));
          }}>
            <div className="sev-fill" style={{width:`${it.sev*10}%`}}/>
          </div>
        </Card>
      ))}

      <div className="block padded">
        <button className="btn primary" onClick={() => setAdding(true)}>
          <IconPlus size={14}/> Detailed log
        </button>
      </div>

      <Sheet open={adding} onClose={() => setAdding(false)} title="Log a symptom">

          <label className="form-l caps xsmall muted">Name</label>

            style={{"--p":`${(newSym.sev-1)/9*100}%`,"--c":"var(--accent)"}}/>
          <label className="form-l caps xsmall muted">Notes</label>
          <textarea value={newSym.note} onChange={e => setNewSym({...newSym, note: e.target.value})} placeholder="What does it feel like?" rows={3} className="text-area"/>
          <button className="btn primary" disabled={!newSym.name} onClick={() => {
            setItems([{ id: Date.now(), ...newSym, time: new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}) }, ...items]);
            setAdding(false); setNewSym({ name:"", sev:5, note:"" });
            toast({ msg: `Logged: ${newSym.name}`, undo: true });

/* ===== Toolkit ===== */

        {playing === "ground" && <GroundPlayer/>}

          <div className="player-placeholder">
            <div className="serif xlarge">Coming soon</div>

          </div>
        )}

    </>
  );
}

/* Box breathing */
function BreathPlayer() {
  const [tick, setTick]       = useState_C(0);
  const [running, setRunning] = useState_C(true);
  useEffect_C(() => {
    if (!running) return;
    const id = setInterval(() => setTick(t => t+1), 1000);
    return () => clearInterval(id);
  }, [running]);
  const phase  = tick % 16;
  const labels = ["Breathe in","Hold","Breathe out","Hold"];
  const idx    = Math.floor(phase / 4);
  const sec    = 4 - (phase % 4);
  const scale  = idx === 0 ? 1 + (phase%4)/4*.5 : idx === 2 ? 1.5 - (phase%4)/4*.5 : idx === 1 ? 1.5 : 1;
  return (
    <div className="breath-stage">
      <div className="breath-orb" style={{ transform:`scale(${scale})` }}/>
      <div className="breath-text">
        <div className="serif xxlarge">{labels[idx]}</div>
        <div className="muted small">{sec}</div>
      </div>
      <button className="btn ghost" onClick={() => setRunning(!running)} style={{maxWidth:200, margin:"20px auto 0"}}>
        {running ? "Pause" : "Resume"}
      </button>
    </div>
  );
}

function GroundPlayer() {
  const steps = [
    { n:5, what:"things you can see"  },
    { n:4, what:"things you can touch"},
    { n:3, what:"things you can hear" },
    { n:2, what:"things you can smell"},
    { n:1, what:"thing you can taste" },
  ];
  const [i, setI] = useState_C(0);
  return (
    <div className="ground-stage">
      <div className="ground-num serif">{steps[i].n}</div>
      <div className="ground-what serif xlarge">{steps[i].what}</div>
      <div className="muted small" style={{marginTop:8}}>Take a breath. Notice. No rush.</div>
      <div className="ground-nav">
        <button className="btn ghost"   onClick={() => setI(Math.max(0, i-1))}             disabled={i===0}>Back</button>
        <button className="btn primary" onClick={() => setI(Math.min(steps.length-1, i+1))} disabled={i===steps.length-1}>Next</button>
      </div>
      <div className="ground-dots">
        {steps.map((_,j) => <span key={j} className={`gd ${j===i?"on":""}`}/>)}
      </div>
    </div>
  );
}

Object.assign(window, { ScreenCare });

<script type="text/babel">
/* Daily v2 — Journal + Insights */
const { useState: useState_J } = React;

function ScreenJournal({ go, entries, setEntries, mood, openCompose }) {

  );

  const save = () => {
    if (!draft.trim()) return;
    const e = { id: Date.now(), kind: "note", text: draft.trim(), t: Date.now() };
    setEntries([e, ...entries]);
    setDraft("");
    setComposing(false);
  };

  return (
    <div className="scroll" data-screen-label="Journal">
      <PageHeader title="Journal" onBack={() => go("today")} action={
        <div className="row" style={{gap:6}}>
          <button className="icon-btn" onClick={() => go("history")} aria-label="History"><IconCalendar size={18}/></button>
          <button className="icon-btn" onClick={() => setComposing(true)} aria-label="New entry"><IconPlus size={18}/></button>
        </div>
      }/>

      <div className="seg">
        {["All","Mood","Notes"].map(t => (
          <button key={t} className={`seg-btn ${filter===t?"active":""}`} onClick={() => setFilter(t)}>{t}</button>
        ))}
      </div>

      {composing && (
        <Card className="compose">
          <div className="muted xsmall caps">New entry · {new Date().toLocaleString([], { weekday:"short", hour:"numeric", minute:"2-digit" })}</div>
          <textarea
            value={draft} onChange={e => setDraft(e.target.value)}
            placeholder="What's here for you right now? No rules."
            rows={5}
            autoFocus
            className="text-area big"
          />
          <div className="row" style={{gap:8, justifyContent:"flex-end", marginTop:10}}>
            <button className="btn ghost" style={{maxWidth: 120}} onClick={() => { setDraft(""); setComposing(false); }}>Cancel</button>
            <button className="btn primary" style={{maxWidth: 120}} disabled={!draft.trim()} onClick={save}>Save</button>
          </div>
        </Card>
      )}

      <SectionLabel right={<span className="muted xsmall">{filtered.length} entries</span>}>This week</SectionLabel>

      {filtered.length === 0 && (
        <div className="empty">No entries yet. Tap + to write something.</div>
      )}

      <div className="timeline padded-x">
        {filtered.map((e, idx) => (
          <div key={e.id} className="t-row">
            <div className="t-rail">
              <span className="t-dot" style={{ background: e.color || (e.kind === "mood" ? "var(--accent)" : "var(--muted)") }}/>
              {idx < filtered.length - 1 && <span className="t-line"/>}
            </div>
            <div className="t-card">
              <div className="row between" style={{alignItems:"flex-start"}}>
                <div>
                  {e.kind === "mood" ? (
                    <>
                      <div className="muted xsmall caps">{new Date(e.t).toLocaleString([], { weekday:"short", hour:"numeric", minute:"2-digit" })}</div>
                      <div className="serif large">{e.label} <span className="muted xsmall">· {e.intensity ? `${e.intensity}/10` : "quick"}</span></div>
                      {e.note && <div className="entry-body">"{e.note}"</div>}
                      {e.tags && e.tags.length > 0 && (
                        <div className="entry-tags">
                          {e.tags.map(t => <span key={t} className="tag-readonly">{t}</span>)}
                        </div>
                      )}
                    </>
                  ) : (
                    <>
                      <div className="muted xsmall caps">{new Date(e.t).toLocaleString([], { weekday:"short", hour:"numeric", minute:"2-digit" })}</div>
                      <div className="entry-body serif large-text">{e.text}</div>
                    </>
                  )}
                </div>
                {e.kind === "mood" && e.color && (
                  <span className="entry-swatch" style={{ background: e.color }}/>
                )}
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}
