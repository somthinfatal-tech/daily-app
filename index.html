function PaneMeds({ meds, setMeds, toast }) {
  const [editing, setEditing]       = useState_C(null);
  const [adding, setAdding]         = useState_C(false);
  const [newMed, setNewMed]         = useState_C(BLANK_MED);
  const [confirmDel, setConfirmDel] = useState_C(null); // stores "name|dose" key
  const [medSearch, setMedSearch]   = useState_C("");
  const [selectedMedInfo, setSelectedMedInfo] = useState_C(null);
  const [showSuggestions, setShowSuggestions] = useState_C(false);

  const todayStr = new Date().toISOString().split("T")[0];

  /* ── time-aware taken check ── */
  const isTakenToday = (m, time) => {
    if (!m.taken || typeof m.taken !== "object") return false;
    const d = m.taken[todayStr];
    if (!d) return false;
    if (typeof d === "boolean") return d; // backward compat
    if (typeof d === "object") return !!(time ? d[time] : Object.values(d).some(Boolean));
    return false;
  };

  const totalDosesToday = meds.reduce((s, m) => s + getMedTimes(m).length, 0);
  const taken = meds.reduce((s, m) => s + getMedTimes(m).filter(t => isTakenToday(m, t)).length, 0);

  /* ── 14-day adherence — counts each scheduled time as one dose ── */
  const adh14 = (() => {
    if (!meds.length) return 0;
    let total = 0, takenDoses = 0;
    for (let i = 0; i < 14; i++) {
      const d = new Date(); d.setDate(d.getDate() - i);
      const ds = d.toISOString().split("T")[0];
      meds.forEach(m => {
        getMedTimes(m).forEach(t => {
          total++;
          const day = m.taken && m.taken[ds];
          if (day && (day === true || (typeof day === "object" && day[t]))) takenDoses++;
        });
      });
    }
    return total === 0 ? 100 : Math.round(takenDoses / total * 100);
  })();

  const sparkValues = Array.from({ length: 14 }, (_, i) => {
    const d = new Date(); d.setDate(d.getDate() - 13 + i);
    const ds = d.toISOString().split("T")[0];
    const total = meds.reduce((s, m) => s + getMedTimes(m).length, 0);
    const takenOnDay = meds.reduce((s, m) => {
      return s + getMedTimes(m).filter(t => {
        const day = m.taken && m.taken[ds];
        return day && (day === true || (typeof day === "object" && day[t]));
      }).length;
    }, 0);
    return total ? takenOnDay / total : 0;
  });

  /* ── mark one dose taken / untaken ── */
  const onCheck = (id, time) => {
    const m = meds.find(x => x.id === id);
    const wasTaken = isTakenToday(m, time);
    const prevDay = (m.taken && typeof m.taken[todayStr] === "object") ? m.taken[todayStr] : {};
    const newDay = { ...prevDay, [time]: !wasTaken };
    setMeds(meds.map(x => x.id === id ? {
      ...x,
      taken: { ...(typeof x.taken === "object" && x.taken ? x.taken : {}), [todayStr]: newDay },
      takenAt: !wasTaken ? new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}) : x.takenAt,
    } : x));
    if (m && !wasTaken) toast({ msg: `${m.name} ${time} marked taken`, undo: true, kind: "med", id, time });
  };

  /* ── add new medication ── */
  const toggleTime = (t) => setNewMed(n => {
    const arr = n.times || [];
    return { ...n, times: arr.includes(t) ? arr.filter(x => x !== t) : [...arr, t] };
  });

  const saveMed = () => {
    if (!newMed.name.trim() || !newMed.dose.trim() || !(newMed.times||[]).length) return;
    setMeds([...meds, { id: Date.now(), ...newMed, taken: {} }]);
    toast({ msg: `${newMed.name} added` });
    setAdding(false);
    setNewMed(BLANK_MED);
    setMedSearch(""); setSelectedMedInfo(null); setShowSuggestions(false);
  };

  /* ── remove ALL doses of a medication by name|dose key ── */
  const removeMed = (key) => {
    const [name, dose] = key.split("|");
    setMeds(meds.filter(x => !(x.name === name && x.dose === dose)));
    setConfirmDel(null);
    setEditing(null);
    toast({ msg: `${name} removed` });
  };

  /* ── unique profiles for "Your medications" section ── */
  const profiles = [...new Map(meds.map(m => [`${m.name}|${m.dose}`, m])).values()];

  /* ── autocomplete suggestions (computed outside JSX) ── */
  const medSuggestions = (showSuggestions && medSearch.length >= 1)
    ? MED_DB.filter(m =>
        m.name.toLowerCase().includes(medSearch.toLowerCase()) ||
        (m.brand && m.brand.toLowerCase().includes(medSearch.toLowerCase()))
      ).slice(0, 8)
    : [];

  return (
    <>
      {/* ── Adherence card ── */}
      <Card accent className="adherence">
        <div className="row between" style={{alignItems:"center"}}>
          <div>
            <div className="muted xsmall caps op85">14-day adherence</div>
            <div className="row baseline" style={{gap:6, marginTop:4}}>
              <div className="serif xxlarge">{adh14}</div>
              <div className="ad-pct-sym">%</div>
            </div>
            <div className="muted small op85">{taken}/{totalDosesToday} dose{totalDosesToday !== 1 ? "s" : ""} today</div>
          </div>
          <div className="ad-ring">
            <svg viewBox="0 0 36 36" width="78" height="78">
              <circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,.25)" strokeWidth="2.5"/>
              <circle cx="18" cy="18" r="15" fill="none" stroke="#FBF5EC" strokeWidth="2.5"
                strokeDasharray={`${(adh14/100)*94.2} 94.2`} strokeLinecap="round" transform="rotate(-90 18 18)"/>
            </svg>
          </div>
        </div>
        <Sparkbars values={sparkValues} accent="#FBF5EC" muted="#FBF5EC55" height={32}/>
      </Card>

      {/* ── Today's doses ── */}
      <SectionLabel right={<span className="muted xsmall">{taken}/{totalDosesToday} taken</span>}>Today</SectionLabel>

      {meds.length === 0 && (
        <div className="empty">No medications scheduled. Tap "Add medication" below to get started.</div>
      )}

      {meds.flatMap(m => getMedTimes(m).map((t, ti) => {
        const rowKey = `${m.id}|${t}|${ti}`;
        const done = isTakenToday(m, t);
        const showMenu = editing === rowKey;
        return (
          <Card key={rowKey} className="med-row-card">
            <div className="med-row-inner">
              <button className={`check ${done?"on":""}`} onClick={() => onCheck(m.id, t)} aria-label={done?"Mark untaken":"Mark taken"}>
                {done && <IconCheck size={14}/>}
              </button>
              <div className="med-meta">
                <div className="med-name">{m.name} <span className="muted regular">{m.dose}</span></div>
                <div className="muted xsmall">{t}{m.note ? ` · ${m.note}` : ""}</div>
                {done && <div className="taken-stamp xsmall">{m.takenAt ? `✓ Taken at ${m.takenAt}` : '✓ Taken'}</div>}
              </div>
              <button className="more" onClick={() => setEditing(showMenu ? null : rowKey)} aria-label="Options">
                <IconMore size={16}/>
              </button>
            </div>
            {showMenu && (
              <div className="med-actions">
                <button className="quiet-btn" onClick={() => { onCheck(m.id, t); setEditing(null); }}>
                  <IconClock size={13}/> {done ? "Mark as not taken" : "Mark as taken"}
                </button>
                <button className="quiet-btn" onClick={() => { toast({ msg: "Snoozed 15 min" }); setEditing(null); }}>
                  <IconBell size={13}/> Snooze 15 min
                </button>
                <button className="quiet-btn danger" onClick={() => { setConfirmDel(`${m.name}|${m.dose}`); setEditing(null); }}>
                  <IconClose size={13}/> Remove this medication
                </button>
                <button className="quiet-btn" onClick={() => setEditing(null)}>Cancel</button>
              </div>
            )}
          </Card>
        );
      }))}

      {/* ── Medication profiles ── */}
      <SectionLabel right={
        <button className="link xsmall" onClick={() => setAdding(true)}>+ Add</button>
      }>Your medications</SectionLabel>

      {profiles.length === 0 && (
        <div className="empty">No medications added yet.</div>
      )}

      {profiles.map((m) => {
        const key = `${m.name}|${m.dose}`;
        const isConfirming = confirmDel === key;
        return (
          <Card key={key} className="med-card">
            <div className="row between" style={{alignItems:"flex-start"}}>
              <div style={{flex:1, minWidth:0}}>
                <div className="med-card-name">{m.name} <span className="muted regular">{m.dose}</span></div>
                <div className="muted xsmall">{m.purpose || "No purpose noted"}{getMedTimes(m).length ? " · " + getMedTimes(m).join(" · ") : ""}</div>
              </div>
              <button className="more" onClick={() => setConfirmDel(isConfirming ? null : key)} aria-label="Remove">
                <IconClose size={15}/>
              </button>
            </div>
            <div className="med-card-chips" style={{marginTop:8}}>
              <span className="chip"><span className="chip-dot dot-good"/>{adh14}% adherence</span>
              {m.supply ? <span className="chip"><IconClock size={11}/> {m.supply} days left</span> : null}
            </div>
            {m.warn && (
              <div className="warn-row"><IconAlert size={13}/> <span>{m.warn}</span></div>
            )}
            {isConfirming && (
              <div className="med-actions" style={{marginTop:10}}>
                <div className="muted small" style={{padding:"4px 0 8px"}}>Remove <strong>{m.name} {m.dose}</strong> and all its scheduled doses?</div>
                <button className="quiet-btn danger" onClick={() => removeMed(key)}>
                  <IconClose size={13}/> Yes, remove medication
                </button>
                <button className="quiet-btn" onClick={() => setConfirmDel(null)}>
                  Cancel
                </button>
              </div>
            )}
          </Card>
        );
      })}

      <div className="block padded">
        <button className="btn primary" onClick={() => setAdding(true)}>
          <IconPlus size={14}/> Add medication
        </button>
      </div>

      {/* ── Add medication sheet ── */}
      <Sheet open={adding} onClose={() => {
        setAdding(false); setNewMed(BLANK_MED);
        setMedSearch(""); setSelectedMedInfo(null); setShowSuggestions(false);
      }} title="Add medication"
        footer={
          <button className="btn primary" style={{width:"100%"}}
            disabled={!newMed.name.trim() || !newMed.dose.trim() || !(newMed.times||[]).length}
            onClick={saveMed}>
            <IconCheck size={14}/> Save medication
          </button>
        }>
        <div className="form" style={{paddingBottom: 20}}>

          {/* Medication name with autocomplete */}
          <label className="form-l caps xsmall muted">Medication name *</label>
          <div className="med-ac-wrap">
            <input
              className="text-input"
              placeholder="Type to search medications…"
              value={medSearch}
              autoFocus
              autoComplete="off"
              onChange={e => {
                const v = e.target.value;
                setMedSearch(v);
                setNewMed(n => ({...n, name: v}));
                setShowSuggestions(v.length >= 1);
                if (!v) { setSelectedMedInfo(null); }
              }}
              onFocus={() => { if (medSearch.length >= 1) setShowSuggestions(true); }}
            />
            {medSuggestions.length > 0 && (
              <div className="med-suggest-list">
                {medSuggestions.map(m => (
                  <button key={m.name} className="med-suggest-item"
                    onPointerDown={() => {
                      setMedSearch(m.name);
                      setNewMed(n => ({...n, name: m.name, purpose: n.purpose || m.purpose || ""}));
                      setSelectedMedInfo(m);
                      setShowSuggestions(false);
                    }}>
                    <span className="msi-name">{m.name}{m.brand ? " · " + m.brand : ""}</span>
                    <span className="msi-meta">{m.cat}</span>
                  </button>
                ))}
              </div>
            )}
          </div>

          {/* Dose with chips */}
          <label className="form-l caps xsmall muted" style={{marginTop:14}}>Dose *</label>
          {selectedMedInfo && (
            <div className="dose-chip-row" style={{marginBottom:6}}>
              {selectedMedInfo.doses.map(d => (
                <button key={d} className={`dose-chip ${newMed.dose===d?"on":""}`}
                  onClick={() => setNewMed(n => ({...n, dose: d}))}>
                  {d}
                </button>
              ))}
            </div>
          )}
          <input className="text-input" placeholder={selectedMedInfo ? "Tap a dose above or type custom" : "e.g. 50mg"}
            value={newMed.dose} onChange={e => setNewMed(n => ({...n, dose: e.target.value}))}/>

          {/* Time — multi-select */}
          <label className="form-l caps xsmall muted" style={{marginTop:14}}>
            Time / schedule *
            {(newMed.times||[]).length > 0 && (
              <span style={{marginLeft:6, color:"var(--accent)", fontWeight:600, textTransform:"none", letterSpacing:0}}>
                {(newMed.times||[]).length} selected
              </span>
            )}
          </label>
          <div className="dose-chip-row" style={{marginBottom:6}}>
            {["6:00 AM","7:00 AM","8:00 AM","9:00 AM","12:00 PM","2:00 PM","6:00 PM","8:00 PM","10:00 PM","Bedtime","As needed"].map(t => (
              <button key={t} className={`dose-chip ${(newMed.times||[]).includes(t)?"on":""}`}
                onClick={() => toggleTime(t)}>
                {t}
              </button>
            ))}
          </div>
          {(newMed.times||[]).length > 0 && (
            <div className="muted xsmall" style={{marginBottom:8}}>
              Scheduled: {(newMed.times||[]).join(" · ")}
            </div>
          )}
          <input className="text-input" placeholder="Add a custom time (press Enter)"
            onKeyDown={e => {
              if (e.key === "Enter" && e.target.value.trim()) {
                toggleTime(e.target.value.trim());
                e.target.value = "";
                e.preventDefault();
              }
            }}/>

          {/* Notes */}
          <label className="form-l caps xsmall muted" style={{marginTop:14}}>Notes</label>
          <input className="text-input" placeholder="e.g. with breakfast, as needed"
            value={newMed.note} onChange={e => setNewMed(n => ({...n, note: e.target.value}))}/>

          {/* Purpose — auto-filled from DB, editable */}
          <label className="form-l caps xsmall muted" style={{marginTop:14}}>Purpose (optional)</label>
          <input className="text-input" placeholder="e.g. For anxiety & depression"
            value={newMed.purpose} onChange={e => setNewMed(n => ({...n, purpose: e.target.value}))}/>

          {/* Warnings */}
          <label className="form-l caps xsmall muted" style={{marginTop:14}}>Warnings / notes (optional)</label>
          <input className="text-input" placeholder="e.g. Take with food, avoid grapefruit"
            value={newMed.warn} onChange={e => setNewMed(n => ({...n, warn: e.target.value}))}/>

        </div>
      </Sheet>

    </>
  );
}

/* ===== Symptoms ===== */
function PaneSymptoms({ items, setItems, meds, toast }) {
  const [adding, setAdding] = useState_C(false);
  const [newSym, setNewSym] = useState_C({ name: "", sev: 5, note: "", kind: "symptom", linkedMed: "", selectedPresets: [], otherText: "" });
  const [activeTab, setActiveTab] = useState_C("symptoms");

  const QUICK_SYMPTOMS = ["Anxiety","Panic","Brain fog","Intrusive thoughts","Low motivation","Restless","Irritable","Couldn't sleep"];
  const SIDE_EFFECT_PRESETS = ["Nausea","Headache","Fatigue","Dizziness","Dry mouth","Insomnia","Drowsiness","Weight change","Appetite change","Mood swings","Anxiety increase","Brain fog","Tremors","Sweating","Heart racing","Blurred vision","Stomach pain","Constipation","Low libido","Other"];

  const adjust = (id, delta) => {
    setItems(items.map(s => s.id === id ? {...s, sev: Math.max(1, Math.min(10, s.sev + delta))} : s));
  };

  const addQuick = (name) => {
    setItems([{ id: Date.now(), name, sev: 5, note: "", kind: "symptom", time: new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}), t: Date.now() }, ...items]);
    toast({ msg: `Logged: ${name}`, undo: true });
  };

  const saveSideEffects = () => {
    const names = [...newSym.selectedPresets.filter(p => p !== "Other")];
    if (newSym.selectedPresets.includes("Other") && newSym.otherText.trim()) names.push(newSym.otherText.trim());
    if (!names.length) return;
    const now = new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
    const newItems = names.map(name => ({ id: Date.now() + Math.random(), name, sev: newSym.sev, note: newSym.linkedMed ? `linked to ${newSym.linkedMed}` : newSym.note, kind: "side-effect", linkedMed: newSym.linkedMed, time: now, t: Date.now() }));
    setItems([...newItems, ...items]);
    setAdding(false);
    setNewSym({ name:"", sev:5, note:"", kind:"symptom", linkedMed:"", selectedPresets:[], otherText:"" });
    toast({ msg: `Logged ${names.length} side effect${names.length>1?"s":""}` });
  };

  const displayItems = activeTab === "side-effects"
    ? items.filter(i => i.kind === "side-effect")
    : items.filter(i => i.kind !== "side-effect");

  return (
    <>
      <div className="seg padded-x" style={{margin:"8px var(--pad)"}}>
        <button className={`seg-btn ${activeTab==="symptoms"?"active":""}`} onClick={() => setActiveTab("symptoms")}>Symptoms</button>
        <button className={`seg-btn ${activeTab==="side-effects"?"active":""}`} onClick={() => setActiveTab("side-effects")}>Side Effects</button>
      </div>

      {activeTab === "symptoms" && (
        <>
          <div className="padded-x muted small mood-prompt">How is your body and mind today?</div>
          <SectionLabel>Quick log</SectionLabel>
          <div className="quick-tags padded-x">
            {QUICK_SYMPTOMS.map(q => (
              <button key={q} className="qtag" onClick={() => addQuick(q)}>+ {q}</button>
            ))}
          </div>
        </>
      )}

      {activeTab === "side-effects" && (
        <>
          <div className="padded-x muted small mood-prompt">Track medication side effects to share with your doctor.</div>
          <SectionLabel>Preset side effects</SectionLabel>
          <div className="se-grid">
            {SIDE_EFFECT_PRESETS.slice(0,12).map(p => (
              <button key={p} className="se-tag" onClick={() => {
                const sel = [p];
                const sev = 5;
                const now = new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
                setItems([{ id: Date.now(), name: p, sev, note: "", kind: "side-effect", linkedMed: "", time: now, t: Date.now() }, ...items]);
                toast({ msg: `Logged: ${p}` });
              }}>+ {p}</button>
            ))}
          </div>
        </>
      )}

      <SectionLabel>Today{displayItems.length > 0 ? ` · ${displayItems.length}` : ""}</SectionLabel>
      {displayItems.length === 0 && (
        <div className="empty">Nothing logged yet. {activeTab === "symptoms" ? "Use the quick chips above or tap + for detail." : "Tap a preset above or use + for detail."}</div>
      )}
      {displayItems.map(it => (
        <Card key={it.id} className="symp">
          <div className="row between">
            <div className="symp-meta">
              <div className="med-name">{it.name}{it.kind==="side-effect" && <span className="xsmall muted" style={{marginLeft:6,fontWeight:400}}>side effect</span>}</div>
              <div className="muted xsmall">{it.time}{it.linkedMed ? ` · ${it.linkedMed}` : ""}{it.note && !it.linkedMed ? ` · "${it.note}"` : ""}</div>
            </div>
            <div className="sev-controls">
              <button className="sev-btn" onClick={() => adjust(it.id, -1)} aria-label="Less">−</button>
              <div className="sev-val">{it.sev}<span className="muted xsmall">/10</span></div>
              <button className="sev-btn" onClick={() => adjust(it.id, +1)} aria-label="More">+</button>
            </div>
          </div>
          <div className="sev-bar" onClick={(e) => {
            const r = e.currentTarget.getBoundingClientRect();

/* Box breathing */
function BreathPlayer() {
  const [tick, setTick]       = useState_C(0);
  const [running, setRunning] = useState_C(true);
  useEffect_C(() => {
    if (!running) return;
    const id = setInterval(() => setTick(t => t+1), 1000);
    return () => clearInterval(id);
  }, [running]);
  const phase  = tick % 16;
  const labels = ["Breathe in","Hold","Breathe out","Hold"];
  const idx    = Math.floor(phase / 4);
  const sec    = 4 - (phase % 4);
  const scale  = idx === 0 ? 1 + (phase%4)/4*.5 : idx === 2 ? 1.5 - (phase%4)/4*.5 : idx === 1 ? 1.5 : 1;
  return (
    <div className="breath-stage">
      <div className="breath-orb" style={{ transform:`scale(${scale})` }}/>
      <div className="breath-text">
        <div className="serif xxlarge">{labels[idx]}</div>
        <div className="muted small">{sec}</div>
      </div>
      <button className="btn ghost" onClick={() => setRunning(!running)} style={{maxWidth:200, margin:"20px auto 0"}}>
        {running ? "Pause" : "Resume"}
      </button>
    </div>
  );
}

function GroundPlayer() {
  const steps = [
    { n:5, what:"things you can see"  },
    { n:4, what:"things you can touch"},
    { n:3, what:"things you can hear" },
    { n:2, what:"things you can smell"},
    { n:1, what:"thing you can taste" },
  ];
  const [i, setI] = useState_C(0);
  return (
    <div className="ground-stage">
      <div className="ground-num serif">{steps[i].n}</div>
      <div className="ground-what serif xlarge">{steps[i].what}</div>
      <div className="muted small" style={{marginTop:8}}>Take a breath. Notice. No rush.</div>
      <div className="ground-nav">
        <button className="btn ghost"   onClick={() => setI(Math.max(0, i-1))}             disabled={i===0}>Back</button>
        <button className="btn primary" onClick={() => setI(Math.min(steps.length-1, i+1))} disabled={i===steps.length-1}>Next</button>
      </div>
      <div className="ground-dots">
        {steps.map((_,j) => <span key={j} className={`gd ${j===i?"on":""}`}/>)}
      </div>
    </div>
  );
}

<script type="text/babel">
/* Daily v2 — Journal + Insights */
const { useState: useState_J } = React;

function ScreenJournal({ go, entries, setEntries, mood, openCompose }) {
  const [composing, setComposing] = useState_J(openCompose || false);
  const [draft, setDraft] = useState_J("");
  const [filter, setFilter] = useState_J("All");

  // Robust date helper — handles both numeric timestamp (e.t) and date string (e.date)
  const entryTs = (e) => {
    if (e.t && typeof e.t === "number") return e.t;
    if (e.date) return new Date(e.date + "T12:00:00").getTime();
    return Date.now();
  };

  const filtered = entries.filter(e =>
    filter === "All" ? true :
    filter === "Mood" ? e.kind === "mood" :
    filter === "Notes" ? e.kind === "note" :

  );

  const save = () => {
    if (!draft.trim()) return;
    const e = { id: Date.now(), kind: "note", text: draft.trim(), t: Date.now() };
    setEntries([e, ...entries]);
    setDraft("");
    setComposing(false);
  };

  return (
    <div className="scroll" data-screen-label="Journal">
      <PageHeader title="Journal" onBack={() => go("today")} action={
        <div className="row" style={{gap:6}}>

          <button className="icon-btn" onClick={() => setComposing(true)} aria-label="New entry"><IconPlus size={18}/></button>
        </div>
      }/>

      <div className="seg">
        {["All","Mood","Notes"].map(t => (
          <button key={t} className={`seg-btn ${filter===t?"active":""}`} onClick={() => setFilter(t)}>{t}</button>
        ))}

            rows={5}
            autoFocus
            className="text-area big"
          />
          <div className="row" style={{gap:8, justifyContent:"flex-end", marginTop:10}}>
            <button className="btn ghost" style={{maxWidth: 120}} onClick={() => { setDraft(""); setComposing(false); }}>Cancel</button>
            <button className="btn primary" style={{maxWidth: 120}} disabled={!draft.trim()} onClick={save}>Save</button>

/* ===== Insights ===== */
function ScreenInsights({ go, entries, meds, symptoms, activities }) {
  const [sharing, setSharing] = useState_J(false);

  const moodEntries = (entries || []).filter(e => e.kind === "mood");
  const noteEntries = (entries || []).filter(e => e.kind === "note");
  const hasEnoughData = moodEntries.length >= 5;

  // Mood trend: compare avg of last 7 days vs prior 7 days
  const now = Date.now();
  const day = 86400000;
  const recent = moodEntries.filter(e => (e.t||0) > now - 7*day);
  const prior  = moodEntries.filter(e => (e.t||0) > now - 14*day && (e.t||0) <= now - 7*day);
  const avg = arr => arr.length ? (arr.reduce((s,e) => s + (e.intensity||5), 0) / arr.length).toFixed(1) : null;
  const recentAvg = avg(recent);
  const priorAvg  = avg(prior);
  const trendDelta = recentAvg && priorAvg ? (parseFloat(recentAvg) - parseFloat(priorAvg)).toFixed(1) : null;
  const trendWord = !recentAvg ? "Not enough data" : trendDelta > 0 ? "Improving" : trendDelta < 0 ? "Dipping" : "Steady";

  // Day-of-week average mood
  const dowData = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d, i) => {
    const dayEntries = moodEntries.filter(e => new Date(e.t||0).getDay() === (i+1)%7);
    const v = dayEntries.length ? dayEntries.reduce((s,e)=>s+(e.intensity||5),0)/dayEntries.length/10 : 0;
    const colors = ["#7B8FA8","#9C7BA7","#7AA68B","#9C7BA7","#7AA68B","#D7A65C","#7AA68B"];
    return { d, v, c: dayEntries.length ? colors[i] : "var(--line)" };
  });

  // Build real insights from data
  const insights = [];
  if (hasEnoughData) {
    // Med adherence insight
    if (meds && meds.length) {
      const todayStr = new Date().toISOString().split("T")[0];
      let total = 0, takenCount = 0;
      for (let i = 0; i < 14; i++) {
        const d = new Date(); d.setDate(d.getDate()-i);
        const ds = d.toISOString().split("T")[0];
        meds.forEach(m => { total++; if (m.taken && m.taken[ds]) takenCount++; });
      }
      const adh = total ? Math.round(takenCount/total*100) : 0;
      if (adh > 0) insights.push({
        headline: `Medication adherence is at ${adh}% over 14 days.`,
        detail: adh >= 80 ? "Great consistency — keep it up." : "Missing doses can affect how your medication works.",
        tone: adh >= 80 ? "good" : "watch",
        tag: "Meds",
      });
    }
    // Symptom pattern
    if (symptoms && symptoms.length >= 3) {
      const top = Object.entries(symptoms.reduce((a,s)=>{a[s.label]=(a[s.label]||0)+1;return a;},{}))
        .sort((a,b)=>b[1]-a[1])[0];
      if (top) insights.push({
        headline: `${top[0]} logged ${top[1]} time${top[1]>1?"s":""} recently.`,
        detail: "Tracking this helps your doctor see patterns over time.",
        tone: "watch",
        tag: "Pattern",
      });
    }
  }

  return (
    <div className="scroll" data-screen-label="Insights">
      <PageHeader title="Insights" onBack={() => go("today")} subtitle="Patterns from your last 14 days"/>

      <Card accent className="insight-hero">
        <div className="caps xsmall op85">Trend</div>
        <div className="serif xxlarge">{trendWord}</div>
        <div className="op85 small" style={{marginTop:4}}>
          {recentAvg
            ? `Avg mood ${recentAvg}/10 this week${trendDelta && prior.length ? ` (${trendDelta > 0 ? "+" : ""}${trendDelta} vs prior week)` : ''}.`
            : `Log 5+ moods to see your trend.`}
        </div>
        {recentAvg && (
          <>
            <div className="mood-bands" style={{marginTop:12}}>
              {[
                { c: "#9C7BA7", w: 8 }, { c: "#7B8FA8", w: 14 },
                { c: "#C9C2A0", w: 22 }, { c: "#7AA68B", w: 34 }, { c: "#D7A65C", w: 22 },
              ].map((b, i) => <span key={i} style={{ background: b.c, flex: b.w }}/>)}
            </div>
            <div className="row between op85 xsmall">
              <span>Rough</span><span>Low</span><span>Okay</span><span>Good</span><span>Great</span>
            </div>
          </>
        )}
      </Card>

      <SectionLabel>By day of week</SectionLabel>
      <Card>
        {!hasEnoughData ? (
          <div className="empty" style={{padding:"12px 0", textAlign:"center"}}>Keep logging to see your day-of-week patterns.</div>
        ) : (
          <div className="dow-row">
            {dowData.map(p => (
              <div key={p.d} className="dow">
                <div className="dow-bar"><span style={{ height: `${Math.max(p.v*100, p.v>0?8:0)}%`, background: p.c }}/></div>
                <div className="dow-l">{p.d}</div>
              </div>
            ))}
          </div>
        )}
      </Card>

      <SectionLabel>What we noticed</SectionLabel>
      {!hasEnoughData && (
        <Card>
          <div style={{padding:"8px 0", textAlign:"center"}}>
            <div className="serif large" style={{marginBottom:6}}>Keep logging</div>
            <div className="muted small">Log at least 5 mood check-ins to start seeing patterns here. The more you log, the smarter the insights.</div>
          </div>
        </Card>
      )}
      {insights.map((i, idx) => (
        <Card key={idx} className={`insight ${i.tone}`}>
          <div className="row between" style={{alignItems:"flex-start"}}>
            <div style={{flex:1}}>
              <div className="caps xsmall" style={{color: i.tone === "good" ? "var(--positive)" : "var(--accent)"}}>{i.tag}</div>
              <div className="serif large">{i.headline}</div>
              <div className="muted small" style={{marginTop:4}}>{i.detail}</div>
            </div>
            <span className={`ins-pill ${i.tone}`}>
              {i.tone === "good" ? <IconSparkle size={14}/> : <IconEye size={14}/>}
            </span>
          </div>
        </Card>
      ))}

      <div className="block padded" style={{display:"flex",gap:8}}>
        <button className="btn primary" style={{flex:2}} onClick={() => go("report")}>
          <IconShareTherapist size={16}/> Prepare Doctor's Report
        </button>
        <button className="btn" style={{flex:1,background:"var(--surface)",border:"1px solid var(--line)"}} onClick={() => setSharing(true)}>
          <IconShare size={14}/> Share
        </button>
      </div>

      <Sheet open={sharing} onClose={() => setSharing(false)} title="Share a summary">
        <TherapistShare onClose={() => setSharing(false)}/>
      </Sheet>
    </div>
  );
}

function TherapistShare({ onClose }) {
  const [range, setRange] = useState_J("Last 14 days");
  const [include, setInclude] = useState_J({
    mood: true, meds: true, symptoms: true, journal: false, toolkit: true,
  });
  const [recipient, setRecipient] = useState_J("Dr. Mira Patel");
  const [sent, setSent] = useState_J(false);

  if (sent) {
    return (
      <div className="share-sent">
        <div className="share-check"><IconCheck size={28}/></div>
        <div className="serif xlarge">Summary sent</div>
        <div className="muted small" style={{marginTop:6, textAlign:"center"}}>A secure link is now in {recipient}'s portal. You can revoke access anytime in settings.</div>
        <button className="btn primary" style={{marginTop:24}} onClick={onClose}>Done</button>
      </div>
    );
  }

  return (
    <div className="form">
      <label className="form-l caps xsmall muted">Recipient</label>
      <input className="text-input" value={recipient} onChange={e => setRecipient(e.target.value)}/>

      <label className="form-l caps xsmall muted">Range</label>
      <div className="seg inline">
        {["Last 7 days","Last 14 days","Last 30 days"].map(r => (
          <button key={r} className={`seg-btn ${range===r?"active":""}`} onClick={() => setRange(r)}>{r}</button>
        ))}
      </div>

      <label className="form-l caps xsmall muted">Include</label>
      <div className="include-list">
        {[
          { k: "mood", l: "Mood entries", sub: "Quick check-ins + detailed" },
          { k: "meds", l: "Medication adherence", sub: "Doses on/off schedule" },
          { k: "symptoms", l: "Symptoms", sub: "Frequency + severity" },
          { k: "journal", l: "Journal entries", sub: "Free-form writing (private by default)" },
          { k: "toolkit", l: "Toolkit use", sub: "What's helping" },
        ].map(o => (
          <button key={o.k} className={`include-row ${include[o.k] ? "on" : ""}`} onClick={() => setInclude({...include, [o.k]: !include[o.k]})}>
            <span className="incl-meta">
              <span className="med-name">{o.l}</span>
              <span className="muted xsmall">{o.sub}</span>
            </span>
            <span className={`incl-check ${include[o.k] ? "on" : ""}`}>
              {include[o.k] && <IconCheck size={12}/>}
            </span>
          </button>
        ))}
      </div>

      <div className="share-foot muted xsmall">
        <IconLock size={11}/> Shared as a read-only encrypted summary. They cannot see future entries unless you re-share.
      </div>

      <button className="btn primary" onClick={() => setSent(true)}><IconSendUp size={14}/> Send to {recipient.split(" ")[0]}</button>
    </div>
  );
}

Object.assign(window, { ScreenJournal, ScreenInsights });

<script type="text/babel">
/* Daily v2 — Onboarding flow */
const { useState: useState_O } = React;

function Onboarding({ onComplete, onSignIn, defaultName }) {
  const [step, setStep] = useState_O(0);
  const [signInMsg, setSignInMsg] = useState_O(false);
  const [data, setData] = useState_O({
    name: defaultName || "",
    email: "",
    pronouns: "",
    ageRange: "",
    reasons: [],
    therapist: "",
    therapistEmail: "",
    checkinTime: "09:00",
    enableMedReminders: true,
    enableCheckinReminder: true,
    biometricLock: false,
    consent: false,
  });

  const set = (k, v) => setData(d => ({ ...d, [k]: v }));
  const toggleReason = (r) => set("reasons", data.reasons.includes(r) ? data.reasons.filter(x => x !== r) : [...data.reasons, r]);

  const STEPS = [
    { id: "welcome",  next: "Create account" },
    { id: "name",     next: "Continue", canNext: () => !!data.name.trim() && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email.trim()) },
    { id: "reasons",  next: "Continue", canNext: () => data.reasons.length > 0 },
    { id: "care",     next: "Continue" },
    { id: "reminders",next: "Continue" },
    { id: "privacy",  next: "I'm in",   canNext: () => data.consent },
    { id: "ready",    next: "Open Daily" },
  ];

  const current = STEPS[step];
  const canAdvance = current.canNext ? current.canNext() : true;
  const advance = () => {
    if (step < STEPS.length - 1) setStep(step + 1);
    else onComplete(data);
  };
  const back = () => step > 0 && setStep(step - 1);

  return (
    <div className="onboard-stage" data-screen-label={`Onboard / ${current.id}`}>
      <div className="onboard-top">
        {step > 0 && step < STEPS.length - 1 && (
          <button className="icon-btn" onClick={back}><IconBack size={18}/></button>
        )}
        {step > 0 ? (
          <div className="onboard-dots">
            {STEPS.slice(1).map((_, i) => (
              <span key={i} className={`od ${i+1 === step ? "on" : ""} ${i+1 < step ? "done" : ""}`}/>
            ))}
          </div>
        ) : <div/>}
        {step > 0 && step < STEPS.length - 1 ? (
          <button className="skip-link" onClick={() => onComplete(data)}>Skip</button>
        ) : <div style={{width:36}}/>}
      </div>

      <div className="onboard-body">
        {current.id === "welcome" && <StepWelcome/>}
        {current.id === "name" && <StepName data={data} set={set}/>}
        {current.id === "reasons" && <StepReasons data={data} toggleReason={toggleReason}/>}
        {current.id === "care" && <StepCare data={data} set={set}/>}
        {current.id === "reminders" && <StepReminders data={data} set={set}/>}
        {current.id === "privacy" && <StepPrivacy data={data} set={set}/>}
        {current.id === "ready" && <StepReady data={data}/>}
      </div>

      <div className="onboard-foot">
        <button className="btn primary" disabled={!canAdvance} onClick={advance}>{current.next}</button>
        {current.id === "welcome" && (
          <>
            <button className="link" style={{marginTop: 12}} onClick={() => {
              if (onSignIn) onSignIn();
              setSignInMsg(true);
            }}>Sign in to existing account</button>
            {signInMsg && (
              <p className="signin-msg">No account found on this device.<br/>Create one above to get started.</p>
            )}
          </>
        )}
      </div>
    </div>
  );
}

function StepWelcome() {
  const features = [
    ["Track moods & medications", "Log daily check-ins, doses, and how you feel"],
    ["Spot patterns over time", "See your mood trends and side effect history"],
    ["Share with your doctor", "Generate clinical reports for appointments"],
    ["Completely private", "Everything stays on your device — nothing shared"],
  ];
  return (
    <div className="welcome">
      <div className="welcome-mark">
        <svg viewBox="0 0 120 120" width="72" height="72">
          <defs>
            <radialGradient id="welcomeG" cx="50%" cy="40%">
              <stop offset="0%" stopColor="white" stopOpacity="0.8"/>
              <stop offset="100%" stopColor="var(--accent)" stopOpacity="0.95"/>
            </radialGradient>
          </defs>
          <circle cx="60" cy="60" r="44" fill="url(#welcomeG)"/>
          <circle cx="60" cy="60" r="44" fill="none" stroke="var(--accent)" strokeWidth="1.5" opacity=".25"/>
        </svg>
      </div>
      <h1 className="serif welcome-title">Daily</h1>
      <p className="welcome-tag">Your private mental wellness companion.</p>
      <ul className="welcome-list">
        {features.map(([title, sub]) => (
          <li key={title} className="welcome-list-item">
            <span className="welcome-check">&#10003;</span>
            <div>
              <div className="welcome-feat-title">{title}</div>
              <div className="welcome-feat-sub">{sub}</div>
            </div>
          </li>
        ))}
      </ul>
    </div>
  );
}

function StepName({ data, set }) {
  const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email.trim());
  const emailDirty = data.email.length > 0;
  return (
    <div className="step">
      <h2 className="serif step-title">First — what should we call you?</h2>
      <p className="muted step-sub">Just a first name. Or a nickname. Whatever feels like you.</p>
      <input
        className="big-input"
        placeholder="Sarah"
        value={data.name}
        onChange={e => set("name", e.target.value)}
        autoFocus
      />
      <label className="form-l caps xsmall muted" style={{marginTop: 16}}>Email address</label>
      <input
        className="text-input"
        type="email"
        placeholder="you@example.com"
        value={data.email}
        onChange={e => set("email", e.target.value)}
        style={emailDirty && !emailValid ? { borderColor: "var(--err, #C0392B)" } : {}}
      />
      {emailDirty && !emailValid && (
        <p className="xsmall" style={{color:"var(--err, #C0392B)", marginTop: 4}}>Please enter a valid email address.</p>
      )}
      <label className="form-l caps xsmall muted" style={{marginTop: 16}}>Pronouns (optional)</label>
      <div className="seg inline">
        {["she/her","he/him","they/them","other"].map(p => (
          <button key={p} className={`seg-btn ${data.pronouns===p?"active":""}`} onClick={() => set("pronouns", p)}>{p}</button>
        ))}
      </div>
    </div>
  );
}

function StepReasons({ data, toggleReason }) {
  const REASONS = [
    { id: "anxiety",     l: "Anxiety",                  ic: "🍃" },
    { id: "depression",  l: "Depression",               ic: "☔" },
    { id: "stress",      l: "Stress & burnout",         ic: "🪨" },
    { id: "panic",       l: "Panic attacks",            ic: "⚡" },
    { id: "adhd",        l: "ADHD",                     ic: "🌀" },
    { id: "ocd",         l: "OCD",                      ic: "🔁" },
    { id: "ptsd",        l: "Trauma / PTSD",            ic: "🌑" },
    { id: "bipolar",     l: "Bipolar",                  ic: "🌗" },
    { id: "sleep",       l: "Sleep issues",             ic: "🌙" },
    { id: "grief",       l: "Grief or loss",            ic: "🕯️" },
    { id: "general",     l: "Just looking after my mind", ic: "🌱" },
    { id: "support",     l: "Supporting someone else",  ic: "🤝" },
  ];
  return (
    <div className="step">
      <h2 className="serif step-title">What brings you to Daily?</h2>
      <p className="muted step-sub">Pick any that fit. You can change this later — and we'll never treat these as a diagnosis.</p>
      <div className="reason-grid">
        {REASONS.map(r => {
          const on = data.reasons.includes(r.id);
          return (
            <button key={r.id} className={`reason ${on ? "on" : ""}`} onClick={() => toggleReason(r.id)}>
              <span className="reason-glyph">{r.ic}</span>
              <span className="reason-l">{r.l}</span>
              <span className={`reason-check ${on ? "on" : ""}`}>{on && <IconCheck size={11}/>}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function StepCare({ data, set }) {
  return (
    <div className="step">
      <h2 className="serif step-title">Anyone on your care team?</h2>
      <p className="muted step-sub">If you have a therapist or psychiatrist, you can add them now — you control what (if anything) they ever see.</p>
      <label className="form-l caps xsmall muted">Therapist / psychiatrist (optional)</label>
      <input className="text-input" placeholder="Dr. Mira Patel" value={data.therapist} onChange={e => set("therapist", e.target.value)}/>
      <label className="form-l caps xsmall muted">Their email or portal (optional)</label>
      <input className="text-input" placeholder="mira@northbay.therapy" value={data.therapistEmail} onChange={e => set("therapistEmail", e.target.value)}/>
      <div className="callout">
        <IconLock size={14}/>
        <span>Nothing is shared until you tap <strong>Share with my therapist</strong> on the Insights screen. You can revoke access any time.</span>
      </div>
    </div>
  );
}

function StepReminders({ data, set }) {
  const TIMES = ["07:00","08:00","09:00","10:00","12:00","17:00","20:00","21:00","22:00"];
  return (
    <div className="step">
      <h2 className="serif step-title">When should we gently check in?</h2>
      <p className="muted step-sub">One daily prompt to log your mood — soft, skippable, no streaks-or-die energy.</p>

      <label className="form-l caps xsmall muted">Daily check-in time</label>
      <div className="time-chips">
        {TIMES.map(t => (
          <button key={t} className={`time-chip ${data.checkinTime===t?"on":""}`} onClick={() => set("checkinTime", t)}>{formatTime(t)}</button>
        ))}
      </div>

      <div className="onboard-toggle">
        <div>
          <div className="med-name">Remind me for medications</div>
          <div className="muted xsmall">At each scheduled dose time</div>
        </div>
        <Toggle on={data.enableMedReminders} onChange={v => set("enableMedReminders", v)}/>
      </div>
      <div className="onboard-toggle">
        <div>
          <div className="med-name">Daily mood check-in</div>
          <div className="muted xsmall">Once a day, soft notification</div>
        </div>
        <Toggle on={data.enableCheckinReminder} onChange={v => set("enableCheckinReminder", v)}/>
      </div>
    </div>
  );
}

function StepPrivacy({ data, set }) {
  return (
    <div className="step">
      <h2 className="serif step-title">Your data, your call.</h2>
      <p className="muted step-sub">A few promises, simply put:</p>
      <ul className="promise-list">
        <li><span className="promise-ic"><IconLock size={14}/></span><div>Entries are encrypted on your device. We don't sell your data, ever.</div></li>
        <li><span className="promise-ic"><IconShield size={14}/></span><div>You can export or delete everything in one tap.</div></li>
        <li><span className="promise-ic"><IconShareTherapist size={14}/></span><div>Sharing is opt-in, per recipient, per session — never the whole vault.</div></li>
        <li><span className="promise-ic"><IconAlert size={14}/></span><div>If we ever detect crisis language, we'll surface a 988 prompt — never an alarm, never reported.</div></li>
      </ul>

      <div className="onboard-toggle">
        <div>
          <div className="med-name">Lock with Face ID / fingerprint</div>
          <div className="muted xsmall">Recommended if you share a phone</div>
        </div>
        <Toggle on={data.biometricLock} onChange={v => set("biometricLock", v)}/>
      </div>

      <button className={`consent-row ${data.consent?"on":""}`} onClick={() => set("consent", !data.consent)}>
        <span className={`incl-check ${data.consent?"on":""}`}>{data.consent && <IconCheck size={11}/>}</span>
        <span>I've read and agree to the <span className="link inline">privacy policy</span> and <span className="link inline">terms</span>.</span>
      </button>
    </div>
  );
}

function StepReady({ data }) {
  const reasons = data.reasons.slice(0, 3);
  return (
    <div className="step ready">
      <div className="ready-mark">
        <svg viewBox="0 0 80 80" width="64" height="64">
          <circle cx="40" cy="40" r="36" fill="var(--positive)"/>
          <path d="M24 40 L36 52 L56 28" fill="none" stroke="white" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      </div>
      <h2 className="serif step-title">All set, {data.name.split(" ")[0]}.</h2>
      <p className="muted step-sub">You'll see your Today screen with a gentle check-in at {formatTime(data.checkinTime)}.</p>
      <div className="ready-summary">
        <div className="rs-row"><span className="rs-l">Account</span><span className="rs-v">{data.email}</span></div>
        <div className="rs-row"><span className="rs-l">Checking in for</span><span className="rs-v">{reasons.length ? reasons.map(r => r[0].toUpperCase() + r.slice(1)).join(" · ") : "general wellbeing"}</span></div>
        <div className="rs-row"><span className="rs-l">Daily prompt</span><span className="rs-v">{formatTime(data.checkinTime)}</span></div>
        {data.therapist && <div className="rs-row"><span className="rs-l">Care team</span><span className="rs-v">{data.therapist}</span></div>}
        <div className="rs-row"><span className="rs-l">Lock</span><span className="rs-v">{data.biometricLock ? "Face ID" : "None"}</span></div>
      </div>
    </div>
  );
}

function formatTime(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  const ampm = h >= 12 ? "PM" : "AM";
  const hr = h % 12 || 12;
  return `${hr}:${String(m).padStart(2,"0")} ${ampm}`;
}

function Toggle({ on, onChange }) {
  return (
    <button className={`toggle ${on?"on":""}`} onClick={() => onChange(!on)} aria-pressed={on}>
      <span className="toggle-knob"/>
    </button>
  );
}

Object.assign(window, { Onboarding, Toggle, formatTime });

</script>
<script type="text/babel">
/* Daily v2 — Settings, Profile, Reminders, History (Calendar) */
const { useState: useState_S } = React;

function ScreenSettings({ go, profile, setProfile, reminders, setReminders }) {
  const [sub, setSub] = useState_S(null);
  if (sub === "profile") return <SubProfile back={() => setSub(null)} profile={profile} setProfile={setProfile}/>;
  if (sub === "reminders") return <SubReminders back={() => setSub(null)} reminders={reminders} setReminders={setReminders}/>;
  if (sub === "privacy") return <SubPrivacy back={() => setSub(null)} profile={profile} setProfile={setProfile}/>;
  if (sub === "care") return <SubCareTeam back={() => setSub(null)} profile={profile} setProfile={setProfile}/>;
  if (sub === "connected") return <SubConnected back={() => setSub(null)}/>;
  if (sub === "data") return <SubData back={() => setSub(null)}/>;
  if (sub === "about") return <SubAbout back={() => setSub(null)}/>;

  return (
    <div className="scroll" data-screen-label="Settings">
      <PageHeader title="Settings" onBack={() => go("today")}/>

      <Card className="profile-summary">
        <div className="profile-avatar">
          <span className="serif">{(profile.name || "S")[0]}</span>
        </div>
        <div style={{flex:1, minWidth:0}}>
          <div className="serif large">{profile.name || "Sarah"}</div>
          <div className="muted xsmall">{profile.email || "sarah@example.com"}</div>
        </div>
        <button className="quiet-btn" onClick={() => setSub("profile")}>Edit</button>
      </Card>

      <SettingsGroup title="You">
        <SettingsRow Ic={IconUser} label="Profile" sub="Name, pronouns, conditions" onClick={() => setSub("profile")}/>
        <SettingsRow Ic={IconShareTherapist} label="Care team" sub={profile.therapist || "Add your therapist or psychiatrist"} onClick={() => setSub("care")}/>
      </SettingsGroup>

      <SettingsGroup title="Notifications">
        <SettingsRow Ic={IconBell} label="Reminders" sub={`Daily check-in · ${formatTime(reminders.checkinTime)}`} onClick={() => setSub("reminders")}/>
      </SettingsGroup>

      <SettingsGroup title="Privacy">
        <SettingsRow Ic={IconLock} label="Privacy & security" sub={profile.biometricLock ? "Face ID on" : "No app lock"} onClick={() => setSub("privacy")}/>
        <SettingsRow Ic={IconShare} label="Data export & sharing" sub="Manage your data" onClick={() => setSub("data")}/>
      </SettingsGroup>

      <SettingsGroup title="Connected services">
        <SettingsRow Ic={IconHeart} label="Apple Health / Health Connect" sub="Not connected" onClick={() => setSub("connected")}/>
        <SettingsRow Ic={IconCalendar} label="Calendar" sub="For appointment reminders" onClick={() => setSub("connected")}/>
      </SettingsGroup>

      <SettingsGroup title="About">
        <SettingsRow Ic={IconSparkle} label="What's new" sub="v0.4.2" onClick={() => setSub("about")}/>
        <SettingsRow Ic={IconShield} label="Crisis resources" sub="988, safety plan, hotlines" onClick={() => go("care", { tab: "Toolkit" })}/>
      </SettingsGroup>

      <div className="settings-foot">
        <button className="link danger">Sign out</button>
        <div className="muted xsmall" style={{marginTop:6}}>Made with care · v0.4.2</div>
      </div>
    </div>
  );
}

const SettingsGroup = ({ title, children }) => (
  <section className="settings-group">
    <SectionLabel>{title}</SectionLabel>
    <Card className="settings-card">{children}</Card>
  </section>
);

const SettingsRow = ({ Ic, label, sub, onClick, right }) => (
  <button className="settings-row" onClick={onClick}>
    <span className="settings-ic"><Ic size={16}/></span>
    <span className="settings-meta">
      <span className="settings-l">{label}</span>
      <span className="muted xsmall">{sub}</span>
    </span>
    {right || <IconChevR size={14} className="op6"/>}
  </button>
);

function SubProfile({ back, profile, setProfile }) {
  const [draft, setDraft] = useState_S(profile);
  const set = (k, v) => setDraft(d => ({ ...d, [k]: v }));
  return (
    <div className="scroll" data-screen-label="Profile">
      <PageHeader title="Profile" onBack={back} action={<button className="link" onClick={() => { setProfile(draft); back(); }}>Save</button>}/>
      <div className="form padded-x">
        <label className="form-l caps xsmall muted">Display name</label>
        <input className="text-input" value={draft.name} onChange={e => set("name", e.target.value)}/>

        <label className="form-l caps xsmall muted">Pronouns</label>
        <div className="seg inline">
          {["she/her","he/him","they/them","other"].map(p => (
            <button key={p} className={`seg-btn ${draft.pronouns===p?"active":""}`} onClick={() => set("pronouns", p)}>{p}</button>
          ))}
        </div>

function ScreenHistory({ go, entries }) {
  const now = new Date();
  const [monthOffset, setMonthOffset] = useState_S(0);
  const [selectedDay, setSelectedDay] = useState_S(null);

  const month = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
  const monthName = month.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const daysInMonth = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
  const startDay = new Date(month.getFullYear(), month.getMonth(), 1).getDay();

  const moodForDay = (d) => {
    const e = entries.find(en => {
      const dt = new Date(en.t);
      return en.kind === "mood" && dt.getFullYear() === month.getFullYear() && dt.getMonth() === month.getMonth() && dt.getDate() === d;
    });
    if (e) return e.color;
    if (monthOffset === 0 && d > now.getDate()) return null;
    const seed = (d * 31 + month.getMonth() * 7 + month.getFullYear()) % 5;
    return ["#9C7BA7","#7B8FA8","#C9C2A0","#7AA68B","#D7A65C"][seed];
  };

  const cells = [];
  for (let i = 0; i < startDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const today = new Date();
  const isToday = (d) => monthOffset === 0 && d === today.getDate();

  const dayEntries = selectedDay
    ? entries.filter(e => {
        const dt = new Date(e.t);
        return dt.getFullYear() === month.getFullYear() && dt.getMonth() === month.getMonth() && dt.getDate() === selectedDay;
      })
    : [];

  return (
    <div className="scroll" data-screen-label="History">
      <PageHeader title="History" onBack={() => go("today")} subtitle="A month at a glance"/>

      <div className="month-nav">
        <button className="icon-btn" onClick={() => setMonthOffset(monthOffset - 1)}><IconBack size={16}/></button>
        <div className="month-name serif large">{monthName}</div>
        <button className="icon-btn" disabled={monthOffset >= 0} onClick={() => setMonthOffset(monthOffset + 1)}>
          <span style={{transform: "scaleX(-1)", display:"inline-flex"}}><IconBack size={16}/></span>
        </button>
      </div>

      <div className="dow-head">
        {["S","M","T","W","T","F","S"].map((d, i) => <span key={i}>{d}</span>)}
      </div>

      <div className="cal-grid">
        {cells.map((d, i) => {
          if (!d) return <div key={i} className="cal-cell cal-empty"/>;
          const color = moodForDay(d);
          const sel = selectedDay === d;
          return (
            <button key={i} className={`cal-cell ${sel ? "sel" : ""} ${isToday(d) ? "today" : ""}`} onClick={() => setSelectedDay(d)}>
              <span className="cal-d">{d}</span>
              {color && <span className="cal-dot" style={{ background: color }}/>}
            </button>
          );
        })}
      </div>

      <div className="cal-legend">
        {[
          { c: "#9C7BA7", l: "Rough" },
          { c: "#7B8FA8", l: "Low" },
          { c: "#C9C2A0", l: "Okay" },
          { c: "#7AA68B", l: "Good" },
          { c: "#D7A65C", l: "Great" },
        ].map(s => (
          <span key={s.l} className="legend-item"><span className="legend-sw" style={{ background: s.c }}/>{s.l}</span>
        ))}
      </div>

      {selectedDay && (
        <>
          <SectionLabel>
            {month.toLocaleDateString(undefined, { weekday: "long", month: "long" })} {selectedDay}
          </SectionLabel>
          {dayEntries.length ? dayEntries.map(e => (
            <Card key={e.id} className="t-card" style={{margin: "0 var(--pad) 10px"}}>
              {e.kind === "mood" ? (
                <>
                  <div className="row between">
                    <div className="muted xsmall caps">{new Date(e.t).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}</div>
                    <span style={{width:12, height:12, borderRadius:4, background: e.color, display:"inline-block"}}/>
                  </div>
                  <div className="serif large">{e.label} <span className="muted xsmall">· {e.intensity ? `${e.intensity}/10` : "quick"}</span></div>
                  {e.note && <div className="entry-body">"{e.note}"</div>}
                </>
              ) : (
                <>
                  <div className="muted xsmall caps">{new Date(e.t).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}</div>
                  <div className="entry-body serif large-text">{e.text}</div>
                </>
              )}
            </Card>
          )) : (
            <div className="empty">Nothing logged this day.</div>
          )}
        </>
      )}
    </div>
  );
}
